<script id="v4-18-smart-schedule">
(() => {
  let dragMatchId = null;
  let dragRecently = false;
  let pendingMovePlan = null;
  let smartFocusCourt = 0;
  window.setScheduleFocus = function(v){smartFocusCourt=Number(v)||0;renderScheduleOnly()};

  const inferSlotMinutes = () => {
    const vals=[...new Set(scheduledMatches().filter(m=>m.time).map(m=>timeToMinutes(m.time)).filter(Number.isFinite))].sort((a,b)=>a-b);
    const diffs=[];for(let i=1;i<vals.length;i++){const d=vals[i]-vals[i-1];if(d>0&&d<=60)diffs.push(d)}
    if(!diffs.length)return 20;
    const counts={};diffs.forEach(d=>counts[d]=(counts[d]||0)+1);
    return Number(Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0])||20;
  };
  const slotEstimate = () => inferSlotMinutes();

  const plannedMatch = (m, overrides) => {
    const o=overrides.get(m.id);return o?{...m,time:o.time,court:o.court}:{...m};
  };
  const issueKey = (type, player, a, b) => `${type}|${playerKey(player)}|${[a,b].sort().join('|')}`;

  function scheduleRiskMap(overrides, affectedPlayers){
    const issues=new Map();
    const slot=slotEstimate(), rest=restMinutes();
    const active=scheduledMatches().filter(m=>m.status==='Scheduled'&&!m.actualStartAt).map(m=>plannedMatch(m,overrides));
    for(const player of affectedPlayers){
      const matches=active.filter(m=>containsPlayer(m,player)).sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time)||a.court-b.court);
      for(let i=0;i<matches.length-1;i++){
        const a=matches[i],b=matches[i+1],ta=timeToMinutes(a.time),tb=timeToMinutes(b.time),gap=tb-ta;
        if(!Number.isFinite(gap))continue;
        if(gap===0){
          const key=issueKey('conflict',player,a.id,b.id);
          issues.set(key,{key,severity:'critical',title:`Schedule conflict — ${player}`,detail:`${a.id} (Court ${a.court}) and ${b.id} (Court ${b.court}) are both scheduled at ${a.time}.`,player,matches:[a.id,b.id]});
          continue;
        }
        const estimatedRest=gap-slot;
        if(gap<=slot){
          const key=issueKey('back-to-back',player,a.id,b.id);
          issues.set(key,{key,severity:'warning',title:`Back-to-back risk — ${player}`,detail:`${a.id} at ${a.time} is followed by ${b.id} at ${b.time} (${gap} min between starts). With an estimated ${slot}-minute match, there is about ${Math.max(0,estimatedRest)} min recovery before the next scheduled start.`,player,matches:[a.id,b.id]});
        }else if(estimatedRest<rest){
          const key=issueKey('rest-risk',player,a.id,b.id);
          issues.set(key,{key,severity:'warning',title:`Rest-window risk — ${player}`,detail:`${a.id} → ${b.id} leaves about ${estimatedRest} min scheduled recovery after an estimated ${slot}-minute match, below the configured ${rest}-minute minimum rest.`,player,matches:[a.id,b.id]});
        }
      }
    }
    return issues;
  }

  function buildMovePlan(id,court,time){
    const m=findMatch(id);
    if(!m)return{blocked:true,blockReason:'Match not found.'};
    if(m.status!=='Scheduled'||m.actualStartAt)return{blocked:true,blockReason:'Only an unstarted Scheduled match can be moved.'};
    if(!Number.isInteger(Number(court))||Number(court)<1||Number(court)>10||!time)return{blocked:true,blockReason:'Choose a valid destination court and time.'};
    court=Number(court);
    if(Number(m.court)===court&&m.time===time)return{blocked:true,noop:true,blockReason:'This match is already assigned to that court and time.'};
    const source={court:Number(m.court),time:m.time};
    const occupant=scheduledMatches().find(x=>x.id!==m.id&&Number(x.court)===court&&x.time===time)||null;
    if(occupant && state.settings?.closedCourts?.[source.court])return{blocked:true,blockReason:`Court ${source.court} is closed. A swap cannot move ${occupant.id} into that unavailable source court.`};
    if(occupant && (occupant.status!=='Scheduled'||occupant.actualStartAt)){
      return{blocked:true,blockReason:`Court ${court} at ${time} is occupied by ${occupant.id}, which has already started or been resolved. That slot cannot be displaced.`};
    }
    const changes=[{id:m.id,fromCourt:source.court,fromTime:source.time,toCourt:court,toTime:time}];
    if(occupant)changes.push({id:occupant.id,fromCourt:Number(occupant.court),fromTime:occupant.time,toCourt:source.court,toTime:source.time,swapped:true});
    const overrides=new Map(changes.map(c=>[c.id,{court:c.toCourt,time:c.toTime}]));
    const affectedPlayers=[...new Set(changes.flatMap(c=>matchPlayers(findMatch(c.id))).map(p=>p))];
    const before=scheduleRiskMap(new Map(),affectedPlayers),after=scheduleRiskMap(overrides,affectedPlayers);
    const newIssues=[...after.values()].filter(x=>!before.has(x.key));
    const persistent=[...after.values()].filter(x=>before.has(x.key) && x.matches.some(mid=>changes.some(c=>c.id===mid)));
    const resolved=[...before.values()].filter(x=>!after.has(x.key) && x.matches.some(mid=>changes.some(c=>c.id===mid))).map(x=>({...x,severity:'resolved'}));
    const critical=newIssues.filter(x=>x.severity==='critical');
    const warnings=newIssues.filter(x=>x.severity==='warning');
    return{blocked:false,match:m,occupant,changes,overrides,affectedPlayers,newIssues,persistent,resolved,critical,warnings,slotMinutes:slotEstimate(),restMinutes:restMinutes()};
  }

  const impactItem = item => `<div class="impact-item ${esc(item.severity)}"><i class="impact-dot"></i><div><b>${esc(item.title)}</b><small>${esc(item.detail)}</small></div></div>`;
  const changeCard = c => {const m=findMatch(c.id);return `<div class="impact-route-card"><small>${esc(c.id)} · ${esc(m?.division||'Match')}</small><b>${esc(teamNamesText(m?.teamA))}<br>vs ${esc(teamNamesText(m?.teamB))}</b><span>Court ${c.fromCourt} · ${esc(c.fromTime)}</span></div>`};
  const destCard = c => {const m=findMatch(c.id);return `<div class="impact-route-card"><small>${esc(c.id)} NEW SLOT</small><b>Court ${c.toCourt} · ${esc(c.toTime)}</b><span>${esc(m?.division||'')} · ${esc(m?.stage||'')}</span></div>`};

  function openMoveImpact(plan){
    pendingMovePlan=plan;
    const modal=document.querySelector('#modalBackdrop .modal');modal?.classList.remove('customizer-mode');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Schedule Move Impact</h2><div class="modal-subtitle">Review the ripple effect before committing this schedule change.</div></div>`;
    const primary=plan.changes[0];
    const newItems=plan.newIssues.length?plan.newIssues.map(impactItem).join(''):'<div class="impact-empty">No new player schedule conflict or rest-window risk was detected from this move.</div>';
    const resolved=plan.resolved.length?`<div class="impact-group"><div class="impact-group-head"><b>Risks resolved by this move</b><span>${plan.resolved.length}</span></div><div class="impact-list">${plan.resolved.map(impactItem).join('')}</div></div>`:'';
    const persistent=plan.persistent.length?`<div class="impact-group"><div class="impact-group-head"><b>Existing risks that remain</b><span>${plan.persistent.length}</span></div><div class="impact-list">${plan.persistent.map(impactItem).join('')}</div></div>`:'';
    document.getElementById('modalBody').innerHTML=`<div class="schedule-impact-summary">
      <div class="impact-route">${changeCard(primary)}<div class="impact-route-arrow">→</div>${destCard(primary)}</div>
      ${plan.occupant?`<div class="impact-banner swap"><strong>Destination slot is occupied — this will be a swap.</strong><span>${esc(plan.occupant.id)} will move into ${esc(primary.id)}'s previous slot: Court ${primary.fromCourt} · ${esc(primary.fromTime)}. No match will be deleted.</span></div>`:''}
      <div class="impact-banner ${plan.critical.length?'blocked':''}"><strong>${plan.critical.length?`${plan.critical.length} hard schedule conflict${plan.critical.length===1?'':'s'} detected`:`Ripple analysis complete`}</strong><span>The forecast uses the published start times, an estimated ${plan.slotMinutes}-minute match slot, and the configured ${plan.restMinutes}-minute player rest rule. Actual tournament readiness will still be enforced from real Actual End timestamps.</span></div>
      <div class="impact-group"><div class="impact-group-head"><b>New consequences</b><span>${plan.newIssues.length}</span></div><div class="impact-list">${newItems}</div></div>
      ${resolved}${persistent}
      <div class="impact-footer-note">Proceeding changes the published court/time assignment only. It does not bypass check-in, active-player, court-occupancy, or actual rest-time safeguards in Match Control.</div>
      <div class="impact-modal-actions"><button class="btn" onclick="cancelScheduleMoveImpact()">Cancel</button><button class="btn primary" onclick="commitScheduleMoveImpact()" ${plan.critical.length?'disabled title="Resolve hard same-time player conflicts before moving this match."':''}>Proceed</button></div>
    </div>`;
    const close=document.getElementById('closeModal');if(close)close.onclick=cancelScheduleMoveImpact;
    document.getElementById('modalBackdrop').classList.add('open');
  }

  window.cancelScheduleMoveImpact=function(){pendingMovePlan=null;document.getElementById('modalBackdrop')?.classList.remove('open')};
  window.commitScheduleMoveImpact=function(){
    const plan=pendingMovePlan;if(!plan)return false;
    if(plan.critical?.length){toast('Schedule move blocked: resolve hard same-time player conflicts first.');return false}
    for(const c of plan.changes){const m=findMatch(c.id);if(!m)continue;m.court=c.toCourt;m.time=c.toTime;m.scheduleModified=true;m.removedFromSchedule=false;}
    const p=plan.changes[0],swap=plan.changes[1];
    pendingMovePlan=null;document.getElementById('modalBackdrop')?.classList.remove('open');
    saveState(swap?`${p.id} moved to Court ${p.toCourt} at ${p.toTime}; ${swap.id} swapped to Court ${swap.toCourt} at ${swap.toTime} after ripple analysis`:`${p.id} moved to Court ${p.toCourt} at ${p.toTime} after ripple analysis`);
    toast(swap?'Schedule swap committed.':'Schedule move committed.');
  };
  window.requestScheduleMove=function(id,court,time){
    const plan=buildMovePlan(id,Number(court),time);
    if(plan.blocked){toast(plan.blockReason);return false}
    openMoveImpact(plan);return true;
  };

  // The form-based Move Scheduled Match uses the same impact analysis as drag/drop.
  window.saveScheduleMove=function(id){
    const m=findMatch(id);if(!m||m.status!=='Scheduled'||m.actualStartAt){toast('Only an unstarted scheduled match can be moved.');return}
    const court=Number(document.getElementById('moveCourt')?.value),time=scheduleDisplayTime(document.getElementById('moveTime')?.value);
    if(!Number.isInteger(court)||court<1||court>10||!time){toast('Choose a valid court and scheduled time.');return}
    requestScheduleMove(id,court,time);
  };

  window.scheduleDragStart=function(e,id){
    const m=findMatch(id);if(!m||m.status!=='Scheduled'||m.actualStartAt){e.preventDefault();toast('Only unstarted scheduled matches can be dragged.');return}
    dragMatchId=id;dragRecently=false;e.currentTarget?.classList.add('schedule-dragging');
    try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)}catch(_){}
  };
  window.scheduleDragEnd=function(e){e.currentTarget?.classList.remove('schedule-dragging');document.querySelectorAll('.schedule-drop-cell').forEach(el=>el.classList.remove('drag-over','drag-blocked'));setTimeout(()=>{dragMatchId=null;dragRecently=false},80)};
  window.scheduleDragOver=function(e){if(!dragMatchId)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){};document.querySelectorAll('.schedule-drop-cell.drag-over').forEach(el=>{if(el!==e.currentTarget)el.classList.remove('drag-over')});e.currentTarget.classList.add('drag-over')};
  window.scheduleDragLeave=function(e){e.currentTarget.classList.remove('drag-over')};
  window.scheduleDrop=function(e,court,time){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=dragMatchId||(()=>{try{return e.dataTransfer.getData('text/plain')}catch(_){return''}})();if(!id)return;dragRecently=true;requestScheduleMove(id,Number(court),time)};
  window.scheduleCardClick=function(e,id){if(dragRecently){e.preventDefault();e.stopPropagation();dragRecently=false;return}openMatch(id)};
  window.openTouchMoveEditor=function(id){openMatch(id);setTimeout(()=>{const p=document.getElementById('moveSchedulePanel');if(p&&p.hidden)toggleMoveSchedulePanel(id)},0)};

  // Final schedule renderer with desktop/tablet-landscape drag/drop and a touch-friendly Move fallback.
  schedule = function(){
    const division=document.getElementById('scheduleDivision')?.value||'All';
    const list=allMatches().filter(m=>!m.removedFromSchedule&&(division==='All'||m.division===division));
    const times=[...new Set([...SCHEDULE_EVENTS.map(e=>e.time),...scheduledMatches().map(m=>m.time)])].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    const divs=[...new Set(BASE_DATA.teams.map(t=>t.division))];

<script id="acms-admin-player-profiles-v421">
(() => {
  const coreOpenMatch = window.openMatch;
  function playerButton(name, extraClass=''){
    if(!name)return '';
    return `<button type="button" class="player-link ${extraClass}" draggable="false" data-player="${esc(name)}" onpointerdown="event.stopPropagation()" ondragstart="event.preventDefault();event.stopPropagation()" onclick="event.stopPropagation();openPlayerProfile(this.dataset.player)">${esc(name)}</button>`;
  }
  function clickableTeamNames(code, separator=' / '){
    const names=teamPlayers(code);
    if(!names.length)return esc(code||'TBD');
    return names.map(n=>playerButton(n)).join(separator);
  }
  function teamForPlayer(name){
    const key=playerKey(name);
    return BASE_DATA.teams.find(t=>(t.players||[]).some(p=>playerKey(p)===key))||null;
  }
  function bracketProgress(team){
    if(!team)return {done:0,total:0,complete:false};
    const ms=state.matches.filter(m=>m.division===team.division&&m.bracket===team.bracket);
    const done=ms.filter(m=>['Completed','Forfeit'].includes(m.status)&&matchWinner(m)).length;
    return {done,total:ms.length,complete:ms.length>0&&done===ms.length};
  }
  function profileMatches(team){
    if(!team)return [];
    return allMatches().filter(m=>m.teamA===team.code||m.teamB===team.code).sort(scheduleSort);
  }
  function profileMatchInfo(m,team){
    const isA=m.teamA===team.code;
    const oppCode=isA?m.teamB:m.teamA;
    const opponent=oppCode?teamNamesText(oppCode):'TBD';
    const own=isA?m.scoreA:m.scoreB,opp=isA?m.scoreB:m.scoreA;
    const finished=['Completed','Forfeit'].includes(m.status)&&matchWinner(m);
    const win=finished?matchWinner(m)===team.code:null;
    const result=m.status==='Forfeit'?(win?'W':'L'):(finished&&own!=null&&opp!=null?`${own}–${opp}`:'—');
    return {oppCode,opponent,own,opp,finished,win,result};
  }
  function availabilityProfile(player){
    const a=playerAvailability(player,'__admin_player_profile__');
    if(a.state==='playing')return {state:'playing',label:'Playing',detail:`Court ${a.match?.court||'—'} · ${a.match?.id||''} · ${a.match?.status||'Live'}`};
    if(a.state==='resting')return {state:'resting',label:'Resting',detail:`Recovery until ${fmtTime(a.readyAt)} after ${a.match?.id||'previous match'}`};
    return {state:'ready',label:'Ready',detail:'Player is currently available.'};
  }
  function playerProfileHtml(player){
    const team=teamForPlayer(player);
    if(!team)return `<div class="player-profile-empty">Player not found in the official ACMS roster.</div>`;
    const partner=(team.players||[]).find(p=>playerKey(p)!==playerKey(player));
    const rows=standingsFor(team.division,team.bracket);
    const row=rows.find(r=>r.code===team.code)||{w:0,l:0,pe:0,pc:0,pq:0,gp:0};
    const rankIndex=rows.findIndex(r=>r.code===team.code);
    const progress=bracketProgress(team);
    const rank=row.gp&&rankIndex>=0?`#${rankIndex+1}`:'—';
    const standingLabel=row.gp?(progress.complete?'Final bracket standing':'Provisional bracket standing'):'No completed preliminary matches yet';
    const matches=profileMatches(team);
    const current=matches.find(m=>['Live','Hold','Timeout'].includes(m.status));
    const upcoming=matches.find(m=>m.status==='Scheduled'&&!m.removedFromSchedule);
    const availability=availabilityProfile(player);
    const nextText=current?`${current.id} · Court ${current.court} · ${current.status}`:upcoming?`${upcoming.id} · ${upcoming.time} · Court ${upcoming.court}`:'No remaining scheduled match';
    const list=matches.map(m=>{
      const info=profileMatchInfo(m,team);
      const resultClass=m.status==='Live'||m.status==='Hold'?'live':info.finished?(info.win?'win':'loss'):'';
      const resultMain=m.status==='Live'?'LIVE':m.status==='Hold'?'HOLD':info.finished?(info.win?'W':'L'):(m.removedFromSchedule?'UNSCHEDULED':m.status.toUpperCase());
      const resultSub=info.finished?(m.status==='Forfeit'?'Forfeit':info.result):(m.status==='Live'||m.status==='Hold'?elapsedText(m.actualStartAt,null):'');
      const schedule=m.removedFromSchedule?'Unscheduled':`${m.time} · Court ${m.court}`;
      return `<div class="player-profile-match">
        <div class="ppm-time"><b>${esc(schedule)}</b><span>${esc(m.id)} · ${esc(m.stage)}</span></div>
        <div class="ppm-opponent"><span>vs ${esc(info.oppCode||'TBD')}</span><b>${esc(info.opponent)}</b><span>${esc(m.division)}${m.bracket?` · Bracket ${esc(m.bracket)}`:''}</span></div>
        <div class="ppm-result ${resultClass}"><strong>${esc(resultMain)}</strong><span>${esc(resultSub||'')}</span></div>
        <button type="button" class="btn tiny" onclick="openMatch('${m.id}')">Open Match</button>
      </div>`;
    }).join('');
    return `<div class="admin-player-profile">
      <div class="player-profile-hero">
        <section class="player-profile-identity">
          <div class="player-profile-kicker">ADMIN PLAYER PROFILE · MY MATCHES</div>
          <h3>${esc(player)}</h3>
          <div class="player-profile-meta"><span>${esc(team.code)}</span><span>${esc(team.division)}</span><span>Bracket ${esc(team.bracket)}</span><span>${esc(team.hospital)}</span><span>${state.checkin?.[team.code]?'Checked In':'Not Checked In'}</span></div>
          <div class="player-profile-partner"><b>Partner:</b> ${partner?playerButton(partner):'—'}<br><b>Hospital:</b> ${esc(hospitalName(team.hospital))}</div>
        </section>
        <section class="player-profile-availability">
          <div class="player-profile-availability-head"><b>Player Availability</b><span class="player-availability-badge ${availability.state}">${esc(availability.label)}</span></div>
          <p>${esc(availability.detail)}</p>
          <div class="player-profile-next"><small>${current?'Current match':'Next match'}</small><b>${esc(nextText)}</b></div>
        </section>
      </div>
      <section class="player-profile-standing">
        <div class="player-profile-section-head"><div><h4>Current Bracket Standing</h4><span>${esc(team.division)} · Bracket ${esc(team.bracket)} · ${esc(standingLabel)}</span></div><span>${progress.done}/${progress.total} bracket matches final</span></div>
        <div class="player-standing-grid">
          <div class="player-standing-stat rank"><small>Rank</small><strong>${esc(rank)}</strong></div>
          <div class="player-standing-stat"><small>W</small><strong>${row.w}</strong></div>
          <div class="player-standing-stat"><small>L</small><strong>${row.l}</strong></div>
          <div class="player-standing-stat"><small>PE</small><strong>${row.pe}</strong></div>
          <div class="player-standing-stat"><small>PC</small><strong>${row.pc}</strong></div>
          <div class="player-standing-stat"><small>PQ</small><strong>${row.pq.toFixed(4)}</strong></div>
        </div>
      </section>
      <section class="player-profile-matches">
        <div class="player-profile-matches-head"><h4>Match Schedule & Results</h4><span class="status">${matches.length} MATCH${matches.length===1?'':'ES'}</span></div>
        <div class="player-profile-match-list">${list||'<div class="player-profile-empty">No matches are assigned to this team.</div>'}</div>
      </section>
    </div>`;
  }
  window.openPlayerProfile=function(player){
    const team=teamForPlayer(player);
    if(!team){toast('Player not found in the official ACMS roster.');return;}
    const modal=document.querySelector('#modalBackdrop .modal');
    modal?.classList.add('player-profile-modal');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Player Profile</h2><div class="modal-subtitle">${esc(player)} · ${esc(team.code)} · ${esc(team.division)}</div></div>`;
    document.getElementById('modalBody').innerHTML=playerProfileHtml(player);
    document.getElementById('modalBackdrop').classList.add('open');
  };
  window.openMatch=function(id){
    document.querySelector('#modalBackdrop .modal')?.classList.remove('player-profile-modal');
    return coreOpenMatch(id);
  };
  window.teamDisplayInline=function(code){
    if(!code)return '<span class="team-primary">TBD</span>';
    if(matchDisplayMode()==='code_hospital')return `<span class="team-primary">${esc(teamLabel(code))}</span>`;
    const primary=clickableTeamNames(code,'');
    const secondary=matchDisplayMode()==='names_code'?teamLabel(code):'';
    return `<span class="team-primary">${primary}</span>${secondary?`<span class="team-secondary">${esc(secondary)}</span>`:''}`;
  };
  window.teamSlotHtml=function(code){
    if(!code)return '<div class="slot-team"><span class="player-name">TBD</span></div>';
    const names=teamPlayers(code);
    const primary=names.length?names.map(n=>playerButton(n,'player-name')).join(''):`<span class="player-name">${esc(code)}</span>`;
    return `<div class="slot-team">${primary}</div>`;
  };
  window.modalTeamCard=function(code,scoreId,scoreValue,scoreLocked=false){
    const lock=scoreLocked?' readonly aria-readonly="true"':'';
    const t=teamMap[code];
    if(!t)return `<div class="ref-team-card"><span class="ref-team-code">TBD</span><div class="ref-team-name">Team to be assigned</div><div class="ref-score-wrap"><input class="score-input" id="${scoreId}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" maxlength="3" value="${scoreValue??''}" aria-label="Score"${lock}></div></div>`;
    const names=(t.players||[]).length?(t.players||[]).map(n=>playerButton(n)).join(''):'Players TBD';
    return `<div class="ref-team-card"><span class="ref-team-code">${esc(t.code)}</span><div class="ref-team-name">${names}</div><div class="ref-team-meta">${esc(t.code)} · ${esc(t.hospital)}</div><div class="ref-team-hospital">${esc(hospitalName(t.hospital))}</div><div class="ref-score-wrap"><input class="score-input" id="${scoreId}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" maxlength="3" value="${scoreValue??''}" aria-label="${esc(t.code)} score"${lock}></div></div>`;
  };
  window.playerReadinessHtml=function(m){
    if(!m?.teamA||!m?.teamB)return'';
    return `<div class="player-readiness-grid">${matchPlayers(m).map(p=>{const a=playerAvailability(p,m.id);const meta=a.state==='playing'?`Court ${a.match?.court||'—'} · ${a.match?.id||''}`:a.state==='resting'?`Ready ${fmtTime(a.readyAt)} · ${Math.max(0,Math.ceil((new Date(a.readyAt)-Date.now())/60000))} min`:a.state==='ready'?'Available now':'';return `<div class="player-readiness-item ${a.state}"><div><b>${playerButton(p)}</b><small>${esc(meta)}</small></div><span>${esc(a.state==='playing'?'PLAYING':a.state==='resting'?'RESTING':'READY')}</span></div>`}).join('')}</div>`;
  };
  window.standingsSection=function(){
    const divisions=[...new Set(BASE_DATA.teams.map(t=>t.division))];
    if(activeStandingsDivision!=='All'&&!divisions.includes(activeStandingsDivision))activeStandingsDivision='All';
    const visibleDivisions=activeStandingsDivision==='All'?divisions:[activeStandingsDivision];
    const cards=[];
    visibleDivisions.forEach(div=>{divisionBrackets(div).forEach(br=>{const rows=standingsFor(div,br);cards.push(`<div class="card standings-pool-card"><div class="standings-pool-head"><div><h3>${esc(div)} • Pool ${esc(br)}</h3></div><div class="standings-pool-metrics">W · L · PE · PC · PQ</div></div><div class="standings-pool-table-wrap"><table class="standings-pool-table"><thead><tr><th>#</th><th>Players</th><th>W</th><th>L</th><th>PE</th><th>PC</th><th>PQ</th></tr></thead><tbody>${rows.map((r,i)=>{const team=teamMap[r.code]||null;const playerText=team?.players?.length?team.players.map(n=>playerButton(n)).join(' / '):esc(r.code);return `<tr><td class="rank-cell">${i+1}</td><td class="player-cell"><strong>${playerText}</strong></td><td>${r.w}</td><td>${r.l}</td><td>${r.pe}</td><td>${r.pc}</td><td>${r.pq.toFixed(4)}</td></tr>`}).join('')}</tbody></table></div></div>`)});});
    return `<div class="section-head standings-head"><div><h1>Standings</h1><p>PE = Points Earned · PC = Points Conceded · PQ = PE ÷ (PE + PC). Click a player name to open their My Matches profile.</p></div><div class="standings-filter-card"><label>Division</label><select onchange="selectDivision(this.value)"><option value="All" ${activeStandingsDivision==='All'?'selected':''}>All standings</option>${divisions.map(d=>`<option value="${esc(d)}" ${d===activeStandingsDivision?'selected':''}>${esc(d)}</option>`).join('')}</select></div></div><div class="standings-pool-grid">${cards.join('')}</div>`;
  };
  window.teamsSection=function(){return rosterManagementSection()};
  // Re-render once so all high-use admin views receive clickable player names immediately.
  try{renderAll();}catch(e){console.error('ACMS player-profile enhancement render failed',e);}
})();
</script>



<script id="acms-admin-player-view-v422">
(() => {
  let selectedPlayer='';
  let returnSection='dashboard';
  const playerSection=document.getElementById('section-player')||(()=>{const s=document.createElement('section');s.className='section';s.id='section-player';document.querySelector('.main')?.appendChild(s);return s})();
  const allRosterPlayers=()=>BASE_DATA.teams.flatMap(t=>(t.players||[]).map(p=>({name:p,team:t}))).sort((a,b)=>a.name.localeCompare(b.name));
  const teamForName=name=>{const k=playerKey(name);return BASE_DATA.teams.find(t=>(t.players||[]).some(p=>playerKey(p)===k))||null};
  const matchListForTeam=team=>team?allMatches().filter(m=>m.teamA===team.code||m.teamB===team.code).sort(scheduleSort):[];
  const matchInfo=(m,team)=>{const isA=m.teamA===team.code,oppCode=isA?m.teamB:m.teamA,own=isA?m.scoreA:m.scoreB,opp=isA?m.scoreB:m.scoreA,winner=matchWinner(m),done=['Completed','Forfeit'].includes(m.status)&&winner;return{isA,oppCode,oppTeam:teamMap[oppCode],own,opp,winner,done,win:done?winner===team.code:null}};
  const fmtMatchScore=(m,info)=>{if(m.status==='Forfeit')return info.win?'W · FORFEIT':'L · FORFEIT';if(info.own!=null&&info.opp!=null)return `${info.own} – ${info.opp}`;if(['Live','Hold','Timeout'].includes(m.status))return `${info.own??0} – ${info.opp??0}`;return '—'};
  const namesHtml=code=>{const ps=teamPlayers(code);return ps.length?ps.map(p=>`<button type="button" class="player-link" onclick="openPlayerProfile('${esc(p).replace(/'/g,"&#39;")}')">${esc(p)}</button>`).join(' / '):esc(code||'TBD')};
  function playerAvailabilitySummary(player){const a=playerAvailability(player,'__admin_player_view__');if(a.state==='playing')return `Playing now · Court ${a.match?.court||'—'} · ${a.match?.id||''}`;if(a.state==='resting')return `Resting · ready ${fmtTime(a.readyAt)}`;return 'Ready to play';}
  const PLAYER_VIEW_DEFAULTS={
    leaderboardScope:'bracket',leaderboardPrimary:'team',showTeamPlayers:true,
    leaderboardColumns:{rank:true,team:true,w:true,l:true,pe:true,pc:true,pq:true,status:true},
    showUpcoming:true,upcomingLimit:0,showCompleted:true,completedLimit:0,
    headerFields:{teamCode:true,hospital:true,division:true,bracket:true,partner:true,checkin:true,availability:true},
    matchFields:{time:true,court:true,opponent:true,status:true,score:true},
    detailFields:{players:true,timing:true,notes:true}
  };
  const pvMerge=(base,raw)=>{const out={...base,...(raw||{})};for(const k of ['leaderboardColumns','headerFields','matchFields','detailFields'])out[k]={...base[k],...((raw||{})[k]||{})};return out};
  const playerViewConfig=()=>pvMerge(PLAYER_VIEW_DEFAULTS,state.settings?.playerView);
  function leaderboardTableHtml(team,rows,bracket,complete,cfg){
    const c=cfg.leaderboardColumns||{};
    const heads=[];if(c.rank)heads.push('<th>#</th>');if(c.team)heads.push(`<th class="apv-team-col">${cfg.leaderboardPrimary==='players'?'Players':'Team'}</th>`);if(c.w)heads.push('<th>W</th>');if(c.l)heads.push('<th>L</th>');if(c.pe)heads.push('<th>PE</th>');if(c.pc)heads.push('<th>PC</th>');if(c.pq)heads.push('<th>PQ</th>');if(c.status)heads.push('<th>Status</th>');
    const body=rows.map((r,i)=>{const t=teamMap[r.code],cells=[];if(c.rank)cells.push(`<td><span class="apv-rank">${i+1}</span></td>`);if(c.team){const playerLabel=(t?.players||[]).map(esc).join(' / ')||esc(r.code),teamLabel=`${esc(r.code)} · ${esc(t?.hospital||'')}`;const primary=cfg.leaderboardPrimary==='players'?playerLabel:teamLabel,secondary=cfg.leaderboardPrimary==='players'?teamLabel:playerLabel;cells.push(`<td class="apv-team-col"><span class="apv-team-name">${primary}</span>${cfg.showTeamPlayers?`<span class="apv-team-players">${secondary}</span>`:''}</td>`);}if(c.w)cells.push(`<td>${r.w}</td>`);if(c.l)cells.push(`<td>${r.l}</td>`);if(c.pe)cells.push(`<td>${r.pe}</td>`);if(c.pc)cells.push(`<td>${r.pc}</td>`);if(c.pq)cells.push(`<td>${Number(r.pq||0).toFixed(4)}</td>`);if(c.status)cells.push(`<td><span class="apv-lb-status">${complete?'Final':'In Progress'}</span></td>`);return `<tr class="${r.code===team.code?'selected':''}">${cells.join('')}</tr>`}).join('');
    return `<div class="apv-leaderboard-head"><div><b>${esc(team.division.toUpperCase())}</b><span>Bracket ${esc(bracket)} leaderboard</span></div><b>${complete?'FINAL':'LIVE / PROVISIONAL'}</b></div><div class="apv-leaderboard-scroll"><table class="apv-leaderboard"><thead><tr>${heads.join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function leaderboardHtml(team){
    const cfg=playerViewConfig();if(cfg.leaderboardScope==='hidden')return '';
    if(cfg.leaderboardScope==='division'){const brackets=divisionBrackets(team.division),blocks=brackets.map(br=>{const rows=standingsFor(team.division,br),prog=state.matches.filter(m=>m.division===team.division&&m.bracket===br),done=prog.filter(m=>['Completed','Forfeit'].includes(m.status)&&matchWinner(m)).length,complete=Boolean(prog.length&&done===prog.length);return `<div class="apv-division-bracket">${leaderboardTableHtml(team,rows,br,complete,cfg)}</div>`}).join('');const count=BASE_DATA.teams.filter(t=>t.division===team.division).length;return `<section class="apv-section"><div class="apv-section-title"><div><h3>Your Division Leaderboards</h3><span>${esc(team.division)} · all brackets shown separately</span></div><span class="apv-count">${count} teams</span></div>${blocks}</section>`;}
    const rows=standingsFor(team.division,team.bracket),prog=state.matches.filter(m=>m.division===team.division&&m.bracket===team.bracket),done=prog.filter(m=>['Completed','Forfeit'].includes(m.status)&&matchWinner(m)).length,complete=Boolean(prog.length&&done===prog.length);
    return `<section class="apv-section"><div class="apv-section-title"><div><h3>Your Assigned Leaderboard</h3><span>${esc(team.division)} · Bracket ${esc(team.bracket)}</span></div><span class="apv-count">${rows.length} teams</span></div>${leaderboardTableHtml(team,rows,team.bracket,complete,cfg)}</section>`;
  }
  function matchCardHtml(m,team){

<script id="v4-33-live-courts-renderer">
(() => {

  const liveCourtCard = m => `<article class="card live-court-card" data-court="${m.court}">
    <div class="live-court-top"><div class="live-court-id"><small>Court</small><strong>${m.court}</strong></div><span class="live-pill">Live</span></div>

    <div class="live-timer-panel"><div class="live-timer-copy"><small>Live elapsed</small><strong class="live-elapsed-clock" data-elapsed-start="${esc(m.actualStartAt||'')}" data-elapsed-end="">${esc(elapsedText(m.actualStartAt,null))}</strong></div><div class="live-started"><b>Actual start</b>${esc(fmtTime(m.actualStartAt))}</div></div>
    <div class="live-card-actions"><button class="btn live-secondary" onclick="openMatch('${m.id}')">Details</button><button class="btn live-primary" onclick="openMatch('${m.id}')">Score / End</button></div>

  liveSection = function(){

  function publicSyncSettingsCard(){const cfg=loadPublicSyncConfig(),configured=remoteConfigured(cfg),payload=buildPublicState(),status=publicSyncStatus,cls=status.state==='ok'?'ok':status.state==='fail'?'fail':configured?'warn':'warn';return`<div class="card settings-card"><div class="settings-title"><span>10</span><h3>Public Player Portal Sync</h3></div><div class="public-privacy-note"><b>Public-state firewall:</b> the Player Portal receives a sanitized payload only. Admin audit history, private match notes, incident/correction reasons, backup metadata and sync credentials are excluded.</div><div class="sync-status-line"><i class="sync-status-dot ${cls}"></i><b>${esc(configured?(status.message||'Configured'):'Remote sync not configured')}</b>${status.lastPublishedAt?`<span class="muted small">Last publish ${esc(fmtDateTime(status.lastPublishedAt))}</span>`:''}</div><div class="sync-settings-grid"><div class="field full"><label>Event ID</label><input id="publicSyncEventId" value="${esc(cfg.eventId||PUBLIC_EVENT_ID)}"></div><div class="field full"><label>Supabase Project URL</label><input id="publicSyncUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.supabaseUrl||'')}"></div><div class="field full"><label>Supabase Publishable Key</label><input id="publicSyncPublishable" type="password" autocomplete="off" placeholder="sb_publishable_..." value="${esc(publicApiKey(cfg))}"></div><div class="field full"><label>Private Publish Key</label><input id="publicSyncPublishKey" type="password" autocomplete="off" placeholder="Stored only on this admin browser" value="${esc(cfg.publishKey||'')}"></div></div><div class="public-state-kpis"><div><small>Public version</small><b>${payload.version}</b></div><div><small>Roster</small><b>${payload.roster.length} teams</b></div><div><small>Matches</small><b>${payload.matches.length+payload.playoffs.length}</b></div></div><div class="sync-actions"><button class="btn primary tiny" onclick="savePublicSyncSettings()">Save Sync Settings</button><button id="testPublicSyncBtn" class="btn tiny" onclick="testPublicSync()">Test & Publish</button><button class="btn tiny" onclick="clearPublicSyncSettings()">Clear</button></div>${status.lastError?`<p class="sync-help" style="color:#9a3e33">${esc(status.lastError)}</p>`:''}<p class="sync-help">Requires the included Supabase public-sync SQL setup. The Supabase publishable key is browser-safe; the private ACMS publish key must remain only on the authorized Admin device.</p></div>`}
  const previousSettingsSection=settingsSection;settingsSection=function(){const html=previousSettingsSection();return html.replace('<div class="card settings-card audit-card">',publicSyncSettingsCard()+'<div class="card settings-card audit-card">')};

  window.healthSection=function(){const checks=window.__acmsProductionPreflightChecks(),fail=checks.filter(x=>x.severity==='fail').length,warn=checks.filter(x=>x.severity==='warn').length,pass=checks.filter(x=>x.severity==='pass').length;return `<div class="section-head"><div><div class="eyebrow">TOURNAMENT SAFETY</div><h1>Preflight & Health</h1><p>Production checks for roster, schedule, courts, standings dependencies, results, public sync, clock and backups.</p></div><div class="head-actions"><button class="btn" onclick="exportData()">Export Backup Now</button><button class="btn primary" onclick="document.getElementById('section-health').innerHTML=healthSection()">Run Checks</button></div></div><div class="preflight-grid"><div class="preflight-stat"><small>PASS</small><strong>${pass}</strong></div><div class="preflight-stat"><small>WARNINGS</small><strong>${warn}</strong></div><div class="preflight-stat"><small>BLOCKERS</small><strong>${fail}</strong></div></div><div class="preflight-rule"><b>Rules currently enforced:</b> bracket ranking = Win Rate → PQ → Head-to-Head → manual review when still unresolved. Scoreless preliminary forfeits = ${state.settings.forfeitPQPolicy==='target_zero'?'11–0 for PE/PC':'excluded from PE/PC while still counting W/L'}. Actual start/end use this device clock.</div><div class="preflight-list">${checks.map(x=>`<div class="preflight-item ${x.severity==='pass'?'':x.severity}"><i></i><div><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div><em>${x.severity}</em></div>`).join('')}</div>`};

  // Publish after the snapshot-producing wrappers finish their synchronous mutations.

<script id="acms-v442-schedule-color-bridge">
(()=>{
  const V442_PALETTE={
    "Intermediate Women's":{bg:'#F58AAF',font:'#5C004B'},
    "Intermediate Men's":{bg:'#85B8EA',font:'#174E72'},
    "Novice Men's":{bg:'#DDEAF8',font:'#285477'},
    "Novice Women's":{bg:'#FFF0F6',font:'#D91275'}
  };
  const oldDefault=window.defaultScheduleCardAppearance;
  window.defaultScheduleCardAppearance=defaultScheduleCardAppearance=function(m){
    const hit=V442_PALETTE[String(m?.division||'')];
    if(hit)return{bg:hit.bg,font:hit.font};
    return typeof oldDefault==='function'?oldDefault(m):{bg:'#F6EAD6',font:'#0E473D'};
  };
  // Rebind effective appearance so publishing, auditing and the customizer all use the same source.
  window.effectiveScheduleCardAppearance=effectiveScheduleCardAppearance=function(m){
    const base=defaultScheduleCardAppearance(m),
      bg=normalizeHexColor(m?.scheduleCardBg)||base.bg,
      font=normalizeHexColor(m?.scheduleCardFont)||base.font,
      custom=Boolean(normalizeHexColor(m?.scheduleCardBg)||normalizeHexColor(m?.scheduleCardFont));
    return{background:bg,font,source:custom?'admin-custom':'admin-default'};
  };
  function utf8ToB64Url(value){
    const bytes=new TextEncoder().encode(value);let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function appearanceBridgePayload(){
    const all=[...(state?.matches||[]),...(state?.playoffs||[])];
    return {schema:'acms-schedule-appearance-v1',eventId:'ACMS-2026-09-22-KINGCOURTS',updatedAt:new Date().toISOString(),matches:Object.fromEntries(all.map(m=>{
      const a=effectiveScheduleCardAppearance(m);return[String(m.id),{background:a.background,font:a.font,source:a.source}]
    }))};
  }
  window.__acmsScheduleAppearanceBridge=function(){return appearanceBridgePayload()};
  const openBtn=document.getElementById('openPlayer');
  if(openBtn){
    openBtn.onclick=()=>{
      // Keep same-origin deployments synchronized through the normal public contract too.
      try{if(typeof publishPublicState==='function')publishPublicState({silent:true})}catch(e){console.warn('Public publish preview failed',e)}
      const token=utf8ToB64Url(JSON.stringify(appearanceBridgePayload()));
      const target=`https://qourts.github.io/ACMS_InterHospital/#acmsScheduleAppearance=${token}`;
      window.open(target,'_blank','noopener,noreferrer');
    };
  }
  // Refresh the schedule once so cards without custom inline values use the corrected canonical palette immediately.
  try{if(document.getElementById('section-schedule')?.classList.contains('active')&&typeof renderScheduleOnly==='function')renderScheduleOnly()}catch(e){console.warn(e)}
})();
</script>

<script id="acms-v448-click-add-schedule-js">
(()=>{
  const section=()=>document.getElementById('section-schedule');
  const slotAt=(court,time)=>scheduledMatches().find(m=>Number(m.court)===Number(court)&&m.time===time)||null;
  const closedCourt=court=>Boolean(state.settings?.closedCourts?.[Number(court)]||state.settings?.closedCourts?.[String(court)]);
  const freeCourtsAt=time=>Array.from({length:10},(_,i)=>i+1).filter(c=>!slotAt(c,time)&&!closedCourt(c));
  const unscheduledCandidates=()=>allMatches().filter(m=>m.removedFromSchedule===true&&m.status==='Scheduled'&&!m.actualStartAt).sort(scheduleSort);
  const selectedCourt=()=>Number(document.getElementById('scheduleAddCourt')?.value||0);

    const nums=state.matches.map(m=>String(m.id||'').match(/^P(\d+)$/i)).filter(Boolean).map(m=>Number(m[1])).filter(Number.isFinite);

  }

  function teamOptions(div,br,selected=''){

    const free=freeCourtsAt(time);if(!court&&!free.length){toast(`No open court is available at ${time}.`);return}

<script id="acms-v449-match-level-selector-js">

<script id="acms-v452-smart-scheduling-js">
(()=>{
  const STAGE_LABELS={pool:'Pool Match',semi:'Semi-Final',bronze:'Bronze Match',gold:'Gold Match'};
  const BASE_SEMI_STAGES=['Semifinal 1','Semifinal 2'];
  const resolved=m=>Boolean(m&&['Completed','Forfeit'].includes(m.status)&&matchWinner(m));
  const selectedCourt=()=>Number(document.getElementById('scheduleAddCourt')?.value||0);
  const targetTime=()=>document.getElementById('scheduleAddTime')?.value||'';
  const selectedStage=()=>document.getElementById('scheduleAddType')?.value||'pool';
  const closedCourt=court=>Boolean(state.settings?.closedCourts?.[Number(court)]||state.settings?.closedCourts?.[String(court)]);
  const slotAt=(court,time)=>scheduledMatches().find(m=>Number(m.court)===Number(court)&&m.time===time)||null;
  const freeCourtsAt=time=>Array.from({length:10},(_,i)=>i+1).filter(c=>!slotAt(c,time)&&!closedCourt(c));
  const modalEl=()=>document.querySelector('#modalBackdrop .modal');
  const closeAdd=()=>{modalEl()?.classList.remove('schedule-add-v452-mode');document.getElementById('modalBackdrop')?.classList.remove('open')};

  function splitDivision(full){
    const value=String(full||'').trim();
    const levels=['Novice','Intermediate','Advanced'];
    const level=levels.find(x=>value===x||value.startsWith(x+' '))||value.split(/\s+/)[0]||'';
    return{level,category:value.slice(level.length).trim()||'Open'};
  }
  const divisionNames=()=>[...new Set(BASE_DATA.teams.map(t=>t.division).filter(Boolean))];
  const divisionLevels=()=>[...new Set(divisionNames().map(d=>splitDivision(d).level))];
  const categoriesFor=level=>[...new Set(divisionNames().filter(d=>splitDivision(d).level===level).map(d=>splitDivision(d).category))];
  const fullDivision=(level,category)=>divisionNames().find(d=>{const x=splitDivision(d);return x.level===level&&x.category===category})||'';
  const bracketsFor=div=>[...new Set(BASE_DATA.teams.filter(t=>t.division===div).map(t=>t.bracket).filter(Boolean))].sort();
  const teamOption=(code,selected='')=>{const t=teamMap[code];return `<option value="${esc(code)}" ${code===selected?'selected':''}>${esc(code)} · Bracket ${esc(t?.bracket||'—')} · ${esc(teamNamesText(code))}</option>`};
  const teamSelectOptions=(codes,selected='')=>`<option value="">Select team</option>`+codes.map(c=>teamOption(c,selected)).join('');
  const samePair=(a,b,x,y)=>Boolean(a&&b&&x&&y&&new Set([a,b]).size===2&&new Set([x,y]).size===2&&[a,b].every(c=>[x,y].includes(c)));

  function poolRecord(code){
    const t=teamMap[code];if(!t)return null;
    const integrity=bracketRoundRobinIntegrity(t.division,t.bracket);
    const row=standingsFor(t.division,t.bracket).find(r=>r.code===code)||null;
    return{team:t,integrity,row,complete:Boolean(integrity.complete),undefeated:Boolean(integrity.complete&&row&&row.l===0&&row.gp===Math.max(0,integrity.teams.length-1))};
  }
  function protectedTeamsFor(a,b){return[a,b].filter(Boolean).filter(code=>poolRecord(code)?.undefeated)}
  function baseSemiFor(m){if(!m)return null;if(m.twiceToBeatDecider&&m.seriesParentId)return findMatch(m.seriesParentId);return BASE_SEMI_STAGES.includes(m.stage)?m:null}
  function seriesMatches(base){if(!base)return[];return state.playoffs.filter(m=>m.id===base.id||m.seriesParentId===base.id).sort((a,b)=>(Number(a.seriesGame)||1)-(Number(b.seriesGame)||1)||a.id.localeCompare(b.id))}
  function seriesOutcome(base){
    if(!base||!base.teamA||!base.teamB)return{resolved:false,winner:'',loser:'',wins:{},required:{},games:[]};
    const games=seriesMatches(base),protectedTeams=Array.isArray(base.twiceToBeatProtectedTeams)?base.twiceToBeatProtectedTeams.filter(c=>[base.teamA,base.teamB].includes(c)):[];
    const required={};
    if(!protectedTeams.length){required[base.teamA]=1;required[base.teamB]=1}
    else if(protectedTeams.length===1){required[base.teamA]=protectedTeams.includes(base.teamA)?1:2;required[base.teamB]=protectedTeams.includes(base.teamB)?1:2}
    else{required[base.teamA]=2;required[base.teamB]=2}
    const wins={[base.teamA]:0,[base.teamB]:0};
    for(const g of games){if(!resolved(g))continue;const w=matchWinner(g);if(w in wins)wins[w]++;if(wins[w]>=required[w])return{resolved:true,winner:w,loser:w===base.teamA?base.teamB:base.teamA,wins,required,games,protectedTeams}}
    return{resolved:false,winner:'',loser:'',wins,required,games,protectedTeams};
  }
  function removeUnstartedDeciders(base){
    const children=state.playoffs.filter(m=>m.seriesParentId===base.id);
    if(children.some(m=>m.actualStartAt||resolved(m)))return false;
    if(!children.length)return false;
    state.playoffs=state.playoffs.filter(m=>m.seriesParentId!==base.id);return true;
  }
  function syncSemifinalFormat(base,{force=false}={}){
    if(!base||!BASE_SEMI_STAGES.includes(base.stage)||!base.teamA||!base.teamB)return false;
    const started=seriesMatches(base).some(m=>m.actualStartAt||resolved(m));
    if(started&&!force&&base.matchFormat)return false;
    const nextProtected=protectedTeamsFor(base.teamA,base.teamB);
    const prior=JSON.stringify([base.matchFormat||'',base.twiceToBeatProtectedTeams||[],base.seriesId||'',base.seriesGame||1]);
    if(!started)removeUnstartedDeciders(base);
    base.matchFormat=nextProtected.length?'twice-to-beat':'standard';base.twiceToBeatProtectedTeams=[...nextProtected];base.seriesId=base.id;base.seriesParentId='';base.seriesGame=1;base.twiceToBeatDecider=false;
    return prior!==JSON.stringify([base.matchFormat,base.twiceToBeatProtectedTeams,base.seriesId,base.seriesGame]);
  }
  function syncAllSemifinalFormats(){let changed=0;for(const m of state.playoffs.filter(x=>BASE_SEMI_STAGES.includes(x.stage)))if(syncSemifinalFormat(m))changed++;return changed}
  function nextDeciderId(base,gameNo){return `${base.id}-TB${gameNo}`}
  function createNextDecider(base){
    const outcome=seriesOutcome(base);if(outcome.resolved||base.matchFormat!=='twice-to-beat')return null;
    const existing=seriesMatches(base),pending=existing.find(m=>!resolved(m)&&m.id!==base.id);if(pending)return pending;
    if(!existing.every(resolved))return null;
    const gameNo=existing.length+1;if(gameNo>3)return null;
    const id=nextDeciderId(base,gameNo),already=findMatch(id);if(already)return already;
    const prior=existing.at(-1)||base;
    const rec={id,kind:'playoff',time:prior.time||base.time,court:Number(prior.court||base.court)||1,teamA:base.teamA,teamB:base.teamB,division:base.division,bracket:'',stage:`${base.stage} Decider`,label:`${base.label||base.stage} · TTB DECIDER`,status:'Scheduled',scoreA:null,scoreB:null,winner:null,notes:'',scheduleModified:true,removedFromSchedule:true,manualCreated:false,matchFormat:'twice-to-beat',twiceToBeatProtectedTeams:[...(base.twiceToBeatProtectedTeams||[])],seriesId:base.id,seriesParentId:base.id,seriesGame:gameNo,twiceToBeatDecider:true,seriesCreatedAt:new Date().toISOString()};
    state.playoffs.push(rec);return rec;
  }
  function reconcileSeries(match){
    const base=baseSemiFor(match);if(!base)return{base:null,outcome:null,created:null};
    if(!seriesMatches(base).some(m=>m.actualStartAt||resolved(m)))syncSemifinalFormat(base);
    const outcome=seriesOutcome(base);if(outcome.resolved)return{base,outcome,created:null};
    const created=createNextDecider(base);return{base,outcome:seriesOutcome(base),created};
  }
  function formatSummary(a,b,sourceMatch=null){
    let protectedTeams=[];
    if(sourceMatch?.twiceToBeatDecider){const base=baseSemiFor(sourceMatch);protectedTeams=[...(base?.twiceToBeatProtectedTeams||[])]}
    else protectedTeams=protectedTeamsFor(a,b);
    if(!protectedTeams.length)return{ttb:false,title:'Standard match',detail:'No zero-loss Twice-to-Beat advantage applies to this matchup.',protectedTeams:[]};
    if(protectedTeams.length===1){const p=protectedTeams[0],other=p===a?b:a;return{ttb:true,title:'Twice-to-Beat · Automatic',detail:`${p} completed pool play with 0 losses. ${p} advances with 1 semifinal win; ${other||'the opponent'} must beat ${p} twice.`,protectedTeams}}
    return{ttb:true,title:'Twice-to-Beat · Both teams undefeated',detail:`${protectedTeams.join(' and ')} both completed pool play with 0 losses. Neither can be eliminated by one semifinal loss; the series becomes first to 2 wins (maximum 3 matches).`,protectedTeams};
  }

  function expectedSemifinalPair(div,stage){const q=qualificationForDivision(div);const idx=stage==='Semifinal 2'?1:0;const p=q?.pairings?.[idx];return p?.a&&p?.b?[p.a,p.b]:[]}
  function resolvedSemiSeries(div){return BASE_SEMI_STAGES.map(stage=>state.playoffs.find(m=>m.division===div&&m.stage===stage)).filter(Boolean).map(base=>({base,...seriesOutcome(base)}))}
  function expectedMedalTeams(div,stageKey){const series=resolvedSemiSeries(div);if(series.length!==2||series.some(x=>!x.resolved))return[];return stageKey==='gold'?series.map(x=>x.winner):series.map(x=>x.loser)}
  function knockoutSlots(div,stageKey){
    if(stageKey==='semi')return state.playoffs.filter(m=>m.division===div&&(BASE_SEMI_STAGES.includes(m.stage)||m.twiceToBeatDecider===true)&&m.status==='Scheduled'&&!m.actualStartAt&&!m.actualEndAt).sort((a,b)=>(a.stage||'').localeCompare(b.stage||'')||(Number(a.seriesGame)||1)-(Number(b.seriesGame)||1));
    const stage=stageKey==='bronze'?'Bronze Match':'Gold Match';return state.playoffs.filter(m=>m.division===div&&m.stage===stage&&m.status==='Scheduled'&&!m.actualStartAt&&!m.actualEndAt);
  }
  function teamCodesForStage(div,stageKey,slot){
    if(stageKey==='pool')return[];
    if(slot?.twiceToBeatDecider)return[slot.teamA,slot.teamB].filter(Boolean);
    if(stageKey==='semi'){
      const q=qualificationForDivision(div);if(q.ready&&!q.unresolvedStandings?.length&&!q.winnerSeedTie?.length&&q.qualifiers?.length===4)return q.qualifiers.map(r=>r.code);
      return BASE_DATA.teams.filter(t=>t.division===div).map(t=>t.code);
    }
    const expected=expectedMedalTeams(div,stageKey);return expected.length?expected:BASE_DATA.teams.filter(t=>t.division===div).map(t=>t.code);
  }
  function ensureSelectValue(id,options,preferred){const el=document.getElementById(id);if(!el)return'';el.innerHTML=options;if(preferred&&[...el.options].some(o=>o.value===preferred))el.value=preferred;return el.value}

  window.scheduleAddFilterChanged=function(){
    const levelSel=document.getElementById('scheduleAddDivisionLevel'),catSel=document.getElementById('scheduleAddCategory');if(!levelSel||!catSel)return;
    const cats=categoriesFor(levelSel.value),priorCat=catSel.value;catSel.innerHTML=cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cats.includes(priorCat))catSel.value=priorCat;
    window.scheduleAddContextChanged();
  };
  window.scheduleAddContextChanged=function(){
    const stage=selectedStage(),level=document.getElementById('scheduleAddDivisionLevel')?.value||'',category=document.getElementById('scheduleAddCategory')?.value||'',div=fullDivision(level,category),context=document.getElementById('scheduleAddContext');if(!context)return;
    const priorContext=context.value;
    if(stage==='pool'){
      context.closest('.field').querySelector('label').textContent='Bracket';const brs=bracketsFor(div);context.innerHTML=brs.map(b=>`<option value="${esc(b)}">Bracket ${esc(b)}</option>`).join('');if(brs.includes(priorContext))context.value=priorContext;
    }else{
      context.closest('.field').querySelector('label').textContent=stage==='semi'?'Semifinal Slot':'Official Match Slot';const slots=knockoutSlots(div,stage);context.innerHTML=slots.length?slots.map(m=>`<option value="${esc(m.id)}">${esc(m.stage)} · ${esc(m.id)}${m.removedFromSchedule?' · Unscheduled':` · ${esc(m.time)} / C${m.court}`}</option>`).join(''):'<option value="">No available official slot</option>';if(slots.some(x=>x.id===priorContext))context.value=priorContext;
    }
    const slot=stage==='pool'?null:findMatch(context.value),aEl=document.getElementById('scheduleAddTeamA'),bEl=document.getElementById('scheduleAddTeamB');if(!aEl||!bEl)return;
    let codes=[];if(stage==='pool')codes=BASE_DATA.teams.filter(t=>t.division===div&&t.bracket===context.value).map(t=>t.code);else codes=teamCodesForStage(div,stage,slot);
    const priorA=aEl.value,priorB=bEl.value;
    let prefA=slot?.teamA||'',prefB=slot?.teamB||'';
    if(!prefA&&!prefB&&stage==='semi'&&slot&&!slot.twiceToBeatDecider){const expected=expectedSemifinalPair(div,slot.stage);prefA=expected[0]||'';prefB=expected[1]||''}
    if((stage==='gold'||stage==='bronze')&&!prefA&&!prefB){const expected=expectedMedalTeams(div,stage);prefA=expected[0]||'';prefB=expected[1]||''}
    aEl.innerHTML=teamSelectOptions(codes,codes.includes(priorA)?priorA:prefA);bEl.innerHTML=teamSelectOptions(codes,codes.includes(priorB)?priorB:prefB);
    if(slot?.twiceToBeatDecider){aEl.value=slot.teamA;bEl.value=slot.teamB;aEl.disabled=true;bEl.disabled=true}else{aEl.disabled=false;bEl.disabled=false}
    window.scheduleAddImpactChanged();
  };
  window.scheduleAddTypeChanged=function(){window.scheduleAddContextChanged()};

  function planAdd(){
    const blockers=[],warnings=[],court=selectedCourt(),time=targetTime(),stageKey=selectedStage(),level=document.getElementById('scheduleAddDivisionLevel')?.value||'',category=document.getElementById('scheduleAddCategory')?.value||'',div=fullDivision(level,category),context=document.getElementById('scheduleAddContext')?.value||'',teamA=document.getElementById('scheduleAddTeamA')?.value||'',teamB=document.getElementById('scheduleAddTeamB')?.value||'';
    if(!court||!time)blockers.push('Choose a valid target court and time.');if(!div)blockers.push('Choose a valid division and category.');if(closedCourt(court))blockers.push(`Court ${court} is closed.`);
    const occ=slotAt(court,time);if(occ)blockers.push(`Court ${court} at ${time} is already occupied by ${occ.id}.`);
    if(!teamA||!teamB)blockers.push('Select Team A and Team B.');else if(teamA===teamB)blockers.push('A team cannot play itself.');
    let target=null,createNew=false,restoreExisting=false;
    if(stageKey==='pool'){
      const a=teamMap[teamA],b=teamMap[teamB];if(!context)blockers.push('Choose a bracket.');
      if(teamA&&teamB&&(!a||!b||a.division!==div||b.division!==div||a.bracket!==context||b.bracket!==context))blockers.push('Both teams must belong to the selected division, category and bracket.');
      if(teamA&&teamB&&teamA!==teamB){const existing=state.matches.find(m=>m.division===div&&m.bracket===context&&((m.teamA===teamA&&m.teamB===teamB)||(m.teamA===teamB&&m.teamB===teamA)));if(existing){if(existing.removedFromSchedule&&existing.status==='Scheduled'&&!existing.actualStartAt){target=existing;restoreExisting=true;warnings.push(`This will restore existing match ${existing.id} from Unscheduled instead of creating a duplicate.`)}else blockers.push(`This pool pairing already exists as ${existing.id}.`)}else createNew=true}
    }else{
      target=findMatch(context);if(!target)blockers.push('Choose an available official playoff slot.');
      if(target&&(!['Scheduled'].includes(target.status)||target.actualStartAt||target.actualEndAt))blockers.push(`${target.id} has already started or been resolved and cannot be repurposed.`);
      if(target?.twiceToBeatDecider&&!samePair(teamA,teamB,target.teamA,target.teamB))blockers.push('Twice-to-Beat decider participants are locked to the original semifinal series.');
      if(target&&teamA&&teamB){const ta=teamMap[teamA],tb=teamMap[teamB];if(!ta||!tb||ta.division!==div||tb.division!==div)blockers.push('Both teams must belong to the selected division and category.');}
      if(target&&!target.removedFromSchedule&&(Number(target.court)!==court||target.time!==time))warnings.push(`${target.id} is currently at ${target.time} / Court ${target.court}. Confirming will move it to ${time} / Court ${court}.`);
      if(target&&(target.teamA||target.teamB)&&!samePair(teamA,teamB,target.teamA,target.teamB))warnings.push(`This overrides the participants currently stored in ${target.id}: ${target.teamA||'TBD'} vs ${target.teamB||'TBD'}.`);
      if(stageKey==='semi'&&target&&!target.twiceToBeatDecider){const q=qualificationForDivision(div),expected=expectedSemifinalPair(div,target.stage);if(!q.ready)warnings.push('Pool play for this division is not complete. Semifinal qualification is not final yet.');else if(q.unresolvedStandings?.length||q.winnerSeedTie?.length||!expected.length)warnings.push('Semifinal qualification still has an unresolved standings/seeding decision.');else if(!samePair(teamA,teamB,expected[0],expected[1]))warnings.push(`This overrides the automatic semifinal pairing ${expected[0]} vs ${expected[1]}.`) }
      if((stageKey==='gold'||stageKey==='bronze')&&target){const expected=expectedMedalTeams(div,stageKey);if(!expected.length)warnings.push('The semifinal series are not both resolved. Medal participants are not final yet.');else if(!samePair(teamA,teamB,expected[0],expected[1]))warnings.push(`This overrides the automatic ${STAGE_LABELS[stageKey]} participants ${expected[0]} vs ${expected[1]}.`) }
    }
    if(teamA&&teamB){const conflict=scheduledMatches().find(m=>m.id!==target?.id&&m.time===time&&[teamA,teamB].some(code=>[m.teamA,m.teamB].includes(code)));if(conflict)blockers.push(`A selected team is already scheduled at ${time} in ${conflict.id}.`);for(const code of [teamA,teamB])if(state.registration?.teamDisqualified?.[code])blockers.push(`${code} is marked disqualified.`)}
    return{blockers,warnings,court,time,stageKey,level,category,div,context,teamA,teamB,target,createNew,restoreExisting};
  }
  window.scheduleAddImpactChanged=function(){
    const plan=planAdd(),box=document.getElementById('scheduleAddImpact'),button=document.getElementById('scheduleAddCommit');if(!box)return;
    const source=plan.stageKey==='semi'?plan.target:null,format=plan.stageKey==='semi'?formatSummary(plan.teamA,plan.teamB,source):{ttb:false,title:'Standard match',detail:plan.stageKey==='pool'?'Pool match · race to 11, no deuce.':plan.stageKey==='bronze'||plan.stageKey==='gold'?'Medal match · race to 15, win by 2.':'',protectedTeams:[]};
    const banner=document.getElementById('scheduleAddFormat');if(banner){banner.className=`schedule-format-banner${format.ttb?' ttb':''}`;banner.innerHTML=`<small>Match format</small><b>${esc(format.title)}</b><span>${esc(format.detail)}</span>`}
    let summary='Ready to schedule — no conflicts detected.',cls='';if(plan.blockers.length){summary=`${plan.blockers.length} blocker${plan.blockers.length===1?'':'s'} must be resolved before scheduling.`;cls='block'}else if(plan.warnings.length){summary=`${plan.warnings.length} scheduling warning${plan.warnings.length===1?'':'s'} will require confirmation.`;cls='warn'}
    box.innerHTML=`<div class="schedule-impact-summary ${cls}"><i></i><b>${esc(summary)}</b></div>${plan.blockers.concat(plan.warnings).length?`<div class="schedule-impact-list">${plan.blockers.map(x=>`<div class="schedule-impact-item block"><b>Blocked:</b> ${esc(x)}</div>`).join('')}${plan.warnings.map(x=>`<div class="schedule-impact-item"><b>Warning:</b> ${esc(x)}</div>`).join('')}</div>`:''}`;
    if(button){button.disabled=plan.blockers.length>0;button.textContent=plan.restoreExisting?'Restore to Schedule':plan.stageKey==='pool'?'Add Pool Match':'Apply to Schedule'};
  };

  window.openScheduleCellAdd=function(court,time){
    court=Number(court)||0;time=String(time||'').trim();if(!time)return;
    if(court&&closedCourt(court)){toast(`Court ${court} is closed. Reopen it in Settings before scheduling a match.`);return}
    const occupied=court?slotAt(court,time):null;if(occupied){toast(`Court ${court} at ${time} is occupied by ${occupied.id}. Open that match to move or remove it first.`);openMatch(occupied.id);return}
    const free=freeCourtsAt(time);if(!court&&!free.length){toast(`No open court is available at ${time}.`);return}
    const chosenCourt=court||free[0],filter=document.getElementById('scheduleDivision')?.value||'All',initialFull=filter!=='All'?filter:divisionNames()[0]||'',parts=splitDivision(initialFull),levels=divisionLevels(),level=levels.includes(parts.level)?parts.level:levels[0]||'',cats=categoriesFor(level),category=cats.includes(parts.category)?parts.category:cats[0]||'';
    const modal=modalEl();modal?.classList.remove('customizer-mode','player-profile-modal');modal?.classList.add('schedule-add-v452-mode');
    document.getElementById('modalTitle').innerHTML=`<div class="modal-title-stack"><h2>Add Match to Schedule</h2><div class="modal-subtitle">${esc(time)} · ${court?`Court ${court}`:'Choose an open court'} · select the tournament match you want here.</div></div>`;
    document.getElementById('modalBody').innerHTML=`<div class="schedule-add-v452">
      <input id="scheduleAddTime" type="hidden" value="${esc(time)}">
      <div class="schedule-add-target"><div><small>Time block</small><b>${esc(time)}</b></div><div><small>Court</small>${court?`<b>Court ${court}</b><input id="scheduleAddCourt" type="hidden" value="${court}">`:`<select id="scheduleAddCourt" onchange="scheduleAddImpactChanged()">${free.map(c=>`<option value="${c}">Court ${c}</option>`).join('')}</select>`}</div></div>
      <div class="schedule-add-context-card"><h3>Match definition</h3><p>Choose the tournament stage first. The portal filters the valid division/category context and teams; official playoff records are reused automatically.</p></div>
      <div class="schedule-add-v452-grid">
        <div class="field"><label>Match Type</label><select id="scheduleAddType" onchange="scheduleAddTypeChanged()"><option value="pool">Pool Match</option><option value="semi">Semi-Final</option><option value="bronze">Bronze Match</option><option value="gold">Gold Match</option></select></div>
        <div class="field"><label>Division</label><select id="scheduleAddDivisionLevel" onchange="scheduleAddFilterChanged()">${levels.map(x=>`<option value="${esc(x)}" ${x===level?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
        <div class="field"><label>Category</label><select id="scheduleAddCategory" onchange="scheduleAddContextChanged()">${cats.map(x=>`<option value="${esc(x)}" ${x===category?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
        <div class="field"><label>Bracket</label><select id="scheduleAddContext" onchange="scheduleAddContextChanged()"></select></div>
        <div class="field"><label>Team A</label><select id="scheduleAddTeamA" onchange="scheduleAddImpactChanged()"></select></div>
        <div class="field"><label>Team B</label><select id="scheduleAddTeamB" onchange="scheduleAddImpactChanged()"></select></div>
      </div>
      <div id="scheduleAddFormat" class="schedule-format-banner"></div>
      <div id="scheduleAddImpact" class="schedule-add-impact"></div>
      <div class="modal-actions"><button class="btn" onclick="safeCloseScheduleAdd()">Cancel</button><button id="scheduleAddCommit" class="btn primary" onclick="createScheduleMatchFromCell()">Add to Schedule</button></div>
    </div>`;
    const close=document.getElementById('closeModal');if(close)close.onclick=closeAdd;document.getElementById('modalBackdrop')?.classList.add('open');window.scheduleAddContextChanged();
  };
  window.safeCloseScheduleAdd=closeAdd;

  function nextPrelimId(){const nums=state.matches.map(m=>String(m.id||'').match(/^P(\d+)$/i)).filter(Boolean).map(m=>Number(m[1])).filter(Number.isFinite);return `P${String(Math.max(80,...nums)+1).padStart(3,'0')}`}
  window.createScheduleMatchFromCell=function(){
    const plan=planAdd();if(plan.blockers.length){window.scheduleAddImpactChanged();toast(plan.blockers[0]);return}
    if(plan.warnings.length){const ok=confirm(`This schedule change has ${plan.warnings.length} warning${plan.warnings.length===1?'':'s'}:\n\n• ${plan.warnings.join('\n• ')}\n\nApply the change?`);if(!ok)return}
    if(plan.stageKey==='pool'){
      if(plan.restoreExisting&&plan.target){plan.target.court=plan.court;plan.target.time=plan.time;plan.target.removedFromSchedule=false;plan.target.scheduleModified=true;closeAdd();saveState(`${plan.target.id} restored to Court ${plan.court} at ${plan.time}`);toast(`${plan.target.id} restored to the schedule.`);return}
      const id=nextPrelimId(),match={id,kind:'prelim',time:plan.time,court:plan.court,teamA:plan.teamA,teamB:plan.teamB,division:plan.div,bracket:plan.context,stage:'Preliminary',status:'Scheduled',scoreA:null,scoreB:null,winner:null,notes:'',scheduleModified:true,removedFromSchedule:false,manualCreated:true,createdAt:new Date().toISOString(),matchFormat:'standard'};state.matches.push(match);closeAdd();saveState(`${id} manually created · Pool Match · ${plan.teamA} vs ${plan.teamB} · Court ${plan.court} at ${plan.time}`);toast(`${id} pool match created and scheduled.`);return;
    }
    const m=plan.target;if(!m)return;
    const participantsChanged=!samePair(plan.teamA,plan.teamB,m.teamA,m.teamB);if(participantsChanged&&!m.twiceToBeatDecider){m.teamA=plan.teamA;m.teamB=plan.teamB;clearMatchRecord(m)}
    m.court=plan.court;m.time=plan.time;m.removedFromSchedule=false;m.scheduleModified=true;m.manualSchedulePlacement=true;
    if(BASE_SEMI_STAGES.includes(m.stage)){syncSemifinalFormat(m,{force:true})}
    closeAdd();saveState(`${m.id} ${m.stage} scheduled · ${plan.teamA} vs ${plan.teamB} · Court ${plan.court} at ${plan.time}${plan.warnings.length?' · confirmed override':''}`);toast(`${m.id} · ${m.stage} scheduled.`);
  };

  // Apply zero-loss Twice-to-Beat format automatically after qualification seeding or manual playoff participant changes.
  const priorApplyQualification=window.applyQualificationLogic;
  if(typeof priorApplyQualification==='function')window.applyQualificationLogic=function(...args){const before=state.playoffs.map(m=>`${m.id}:${m.teamA}:${m.teamB}`).join('|');const result=priorApplyQualification.apply(this,args);const changed=syncAllSemifinalFormats();if(changed){saveState(`Twice-to-Beat eligibility evaluated for ${changed} semifinal slot${changed===1?'':'s'} using the 0-loss pool rule`)}return result};
  const priorAssignPlayoff=window.assignPlayoff;
  if(typeof priorAssignPlayoff==='function')window.assignPlayoff=function(id,side,code){const result=priorAssignPlayoff(id,side,code),m=findMatch(id);if(m&&BASE_SEMI_STAGES.includes(m.stage)&&m.status==='Scheduled'&&!m.actualStartAt){if(syncSemifinalFormat(m,{force:true}))saveState(`${m.id} Twice-to-Beat eligibility recalculated after participant assignment`)}return result};

  // Automatically create required semifinal deciders after a completed/forfeited TTB game.
  function postResolveSeries(id,beforeStatus){const m=findMatch(id);if(!m||!m.stage?.startsWith('Semifinal')||!resolved(m)||beforeStatus===m.status)return;const result=reconcileSeries(m);if(!result.base)return;if(result.created){saveState(`${result.base.id} Twice-to-Beat continues · ${result.created.id} created as an Unscheduled decider`);toast(`Twice-to-Beat: ${result.created.id} decider created. Place it in an open schedule cell.`);return}if(result.outcome?.resolved&&result.base.matchFormat==='twice-to-beat')toast(`Twice-to-Beat series resolved: ${result.outcome.winner} advances.`)}
  const priorCaptureEnd=window.captureEnd;if(typeof priorCaptureEnd==='function')window.captureEnd=function(id){const before=findMatch(id)?.status;const r=priorCaptureEnd(id);postResolveSeries(id,before);return r};
  const priorConfirmForfeit=window.confirmForfeit;if(typeof priorConfirmForfeit==='function')window.confirmForfeit=function(id){const before=findMatch(id)?.status;const r=priorConfirmForfeit(id);postResolveSeries(id,before);return r};
  const priorSaveMatch=window.saveMatch;if(typeof priorSaveMatch==='function')window.saveMatch=function(id,close){const m=findMatch(id),wasResolved=resolved(m),oldWinner=matchWinner(m);const r=priorSaveMatch(id,close);const now=findMatch(id);if(now?.stage?.startsWith('Semifinal')&&wasResolved&&resolved(now)&&oldWinner!==matchWinner(now)){const base=baseSemiFor(now);if(base){const children=state.playoffs.filter(x=>x.seriesParentId===base.id);if(children.some(x=>x.actualStartAt||resolved(x))){toast('Semifinal result changed after a Twice-to-Beat decider started. Review the series before advancing medal matches.')}else{removeUnstartedDeciders(base);const rr=reconcileSeries(base);if(rr.created)saveState(`${base.id} series recalculated after score correction; ${rr.created.id} recreated`)}}}return r};

  // Medal advancement now resolves the semifinal SERIES, not merely Game 1.
  window.advanceMedalMatches=function(){
    const stale=[...new Set(state.playoffs.map(p=>p.division))].filter(qualificationStale);if(stale.length){toast(`Re-apply Qualification Logic first: preliminary results changed for ${stale.join(', ')}.`);return}
    let seeded=0,protectedSlots=0;const waiting=[];state.settings.medalSnapshots=state.settings.medalSnapshots||{};
    for(const div of [...new Set(BASE_DATA.teams.map(t=>t.division))]){
      const bases=BASE_SEMI_STAGES.map(stage=>state.playoffs.find(p=>p.division===div&&p.stage===stage)).filter(Boolean);if(bases.length<2)continue;
      const outcomes=bases.map(seriesOutcome);if(outcomes.some(x=>!x.resolved)){waiting.push(div);continue}
      const winners=outcomes.map(x=>x.winner),losers=outcomes.map(x=>x.loser),gold=state.playoffs.find(p=>p.division===div&&p.stage==='Gold Match'),bronze=state.playoffs.find(p=>p.division===div&&p.stage==='Bronze Match');
      if(gold){seedPlayoffPair(gold,winners[0],winners[1])?seeded++:protectedSlots++}if(bronze){seedPlayoffPair(bronze,losers[0],losers[1])?seeded++:protectedSlots++}state.settings.medalSnapshots[div]=semifinalSignature(div);
    }
    saveState(`Applied resolved semifinal series to ${seeded} medal-match slots${waiting.length?`; waiting on ${waiting.join(', ')}`:''}${protectedSlots?`; ${protectedSlots} active/resolved medal slot(s) protected`:''}`);
    toast(waiting.length?`Medal update applied where ready. Still waiting on semifinal series: ${waiting.join(', ')}.`:'Medal matches updated from resolved semifinal series.');
  };

  function ttbBannerHtml(m){const base=baseSemiFor(m);if(!base||base.matchFormat!=='twice-to-beat')return'';const out=seriesOutcome(base),p=base.twiceToBeatProtectedTeams||[],game=Number(m.seriesGame)||1,pending=seriesMatches(base).find(x=>x.removedFromSchedule&&x.status==='Scheduled');let rule='';if(p.length===1){const other=p[0]===base.teamA?base.teamB:base.teamA;rule=`${p[0]} has the zero-loss advantage: 1 win to advance; ${other} needs 2.`}else rule='Both semifinalists were undefeated in pool play: first to 2 wins.';const score=`Series: ${base.teamA} ${out.wins?.[base.teamA]||0}–${out.wins?.[base.teamB]||0} ${base.teamB}`;return `<div class="ttb-match-banner"><div class="ttb-head"><b>Twice-to-Beat Semifinal</b><span class="ttb-pill">GAME ${game}</span></div><span>${esc(rule)}</span><span>${esc(score)}${out.resolved?` · ${esc(out.winner)} advances`:''}</span>${pending?`<span><b>${esc(pending.id)}</b> is waiting in Unscheduled Matches. Place it by tapping/clicking an empty schedule cell.</span>`:''}</div>`}
  const priorOpenMatch=window.openMatch;if(typeof priorOpenMatch==='function')window.openMatch=function(id){priorOpenMatch(id);const m=findMatch(id),body=document.getElementById('modalBody');if(m&&body&&!document.getElementById('ttbMatchBanner')){const html=ttbBannerHtml(m);if(html){const wrap=document.createElement('div');wrap.id='ttbMatchBanner';wrap.innerHTML=html;body.prepend(wrap)}}};

  function decorateTtbScheduleCards(){document.querySelectorAll('#section-schedule .slot[onclick*="openMatch("]').forEach(el=>{if(el.querySelector('.ttb-schedule-badge'))return;const id=(el.getAttribute('onclick')||'').match(/openMatch\('([^']+)'\)/)?.[1],m=id?findMatch(id):null,base=baseSemiFor(m);if(base?.matchFormat==='twice-to-beat')el.insertAdjacentHTML('beforeend',`<small class="ttb-schedule-badge">Twice-to-Beat${m.twiceToBeatDecider?' · Decider':''}</small>`)})}
  const priorRenderScheduleOnly=window.renderScheduleOnly;if(typeof priorRenderScheduleOnly==='function')window.renderScheduleOnly=function(...args){const r=priorRenderScheduleOnly.apply(this,args);requestAnimationFrame(decorateTtbScheduleCards);return r};
  const scheduleSection=document.getElementById('section-schedule');if(scheduleSection)new MutationObserver(()=>decorateTtbScheduleCards()).observe(scheduleSection,{childList:true,subtree:true});

  // Add series health checks to production Preflight.
  const priorPreflight=window.__acmsProductionPreflightChecks;if(typeof priorPreflight==='function')window.__acmsProductionPreflightChecks=function(){const rows=priorPreflight();const orphan=[];for(const base of state.playoffs.filter(x=>BASE_SEMI_STAGES.includes(x.stage)&&x.matchFormat==='twice-to-beat')){const out=seriesOutcome(base);if(resolved(base)&&!out.resolved){const pending=seriesMatches(base).some(x=>x.id!==base.id&&!resolved(x));if(!pending)orphan.push(base.id)}}rows.push({severity:orphan.length?'fail':'pass',title:'Twice-to-Beat series continuity',detail:orphan.length?`Missing required decider for: ${orphan.join(', ')}.`:'Every active Twice-to-Beat semifinal series is either resolved or has its required decider retained.'});return rows};

  // Migration/evaluation for an existing v4.51 browser state; do not rewrite started series.
  const migrated=syncAllSemifinalFormats();if(migrated){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
  window.__acmsV452={poolRecord,protectedTeamsFor,baseSemiFor,seriesMatches,seriesOutcome,reconcileSeries,syncAllSemifinalFormats,expectedMedalTeams,planAdd};
  requestAnimationFrame(decorateTtbScheduleCards);
})();
