/* =========================================================
   ACMS HUMAN-DIRECTED LIGHT THEME
   Intent: editorial, restrained, operational — not "SaaS AI"
   Tournament logic is untouched. This is presentation only.

html[data-theme="light"]{
  --bg:#ecefeb;
  --bg2:#f5f6f3;
  --panel:#ffffff;
  --panel2:#f4f6f3;
  --surface:#f8f9f7;
  --surface2:#eef2ee;

  --olive:#6f855d;
  --teal:#4f7d73;
  --danger:#b84747;
  --success:#2f7656;
  --info:#3d6785;
  --shadow:none;
  --shadow-soft:none;
  --radius:6px;
  --focus:0 0 0 3px rgba(23,63,53,.16);
}

html[data-theme="light"] .availability.playing{color:#8f3035 !important;background:#f7e8e9 !important;border-color:#d7a3a6 !important}
html[data-theme="light"] .availability.resting{color:#654d80 !important;background:#f0ebf5 !important;border-color:#c2b1d0 !important}

/* Buttons and inputs: product controls, not presentation components */

html[data-theme="light"] .btn.danger{background:#fff !important;color:#9d3e3e !important;border-color:#d0a0a0 !important}
html[data-theme="light"] input,
html[data-theme="light"] select,
html[data-theme="light"] textarea,
html[data-theme="light"] .field input,
html[data-theme="light"] .field select,
html[data-theme="light"] .field textarea,

/* Callouts: quiet notes with one left rule */

}

/* Queue and operational cards */
html[data-theme="light"] .queue{gap:0;border-top:1px solid #d9dfdb}
html[data-theme="light"] .queue-row{

  border-bottom:1px solid #d9dfdb !important;

}
html[data-theme="light"] .queue-row:hover{background:#f7f8f6 !important}

html[data-theme="light"] .playing-card,
html[data-theme="light"] .rest-row,
html[data-theme="light"] .timing-panel,
html[data-theme="light"] .timing-item,
html[data-theme="light"] .qualifier-item,
html[data-theme="light"] .wildcard-candidate{

}

/* Schedule: make it read like a professional control board */
html[data-theme="light"] .schedule-source{

  border-bottom:1px solid #ccd4cf !important;
  border-radius:0 !important;
  background:transparent !important;

  color:#6d7973;
}
html[data-theme="light"] .schedule-source b{color:#173f35}
html[data-theme="light"] .schedule-legend{gap:16px;margin:0 0 12px;padding:0}
html[data-theme="light"] .schedule-legend span{

  border-radius:0 !important;
  background:transparent !important;
  padding:2px 0 !important;

html[data-theme="light"] .schedule-table{background:#fff}
html[data-theme="light"] .schedule-table th{
  background:#173f35 !important;
  color:#fff !important;
  border-color:#355b50 !important;
  padding:10px 8px;
  letter-spacing:.11em;
}
html[data-theme="light"] .schedule-table th:first-child{background:#102f27 !important}
html[data-theme="light"] .schedule-table td{
  background:#fbfcfa;
  border-color:#d8ddda !important;
  padding:4px;
}
html[data-theme="light"] .schedule-table td:first-child{
  background:#f0f2ef !important;
  color:#173f35 !important;
  border-color:#ccd3cf !important;

}
html[data-theme="light"] .slot{

  border-radius:3px !important;
  background:#fff !important;

  border-color:#9caba3 !important;
  transform:none !important;
}
html[data-theme="light"] .slot b,
html[data-theme="light"] .slot .player-name{color:#18352c;font-weight:800}
html[data-theme="light"] .slot small{color:#7a8580;font-size:8px}
html[data-theme="light"] .slot-vs{color:#8b938f;text-transform:uppercase;font-size:7px;letter-spacing:.12em;margin:3px 0}
html[data-theme="light"] .slot.div-iw{box-shadow:inset 4px 0 0 #c44287 !important}
html[data-theme="light"] .slot.div-im{box-shadow:inset 4px 0 0 #2d5d78 !important}
html[data-theme="light"] .slot.div-nm{box-shadow:inset 4px 0 0 #7797bd !important}
html[data-theme="light"] .slot.div-nw{box-shadow:inset 4px 0 0 #c88fac !important}
html[data-theme="light"] .slot.playoff{outline:1px solid #c2a45c !important;outline-offset:-1px}
html[data-theme="light"] .slot.live{outline:2px solid #b84747 !important;outline-offset:-2px}
html[data-theme="light"] .schedule-event-cell{background:#f4f2e9 !important;color:#31463f !important}

/* Tables */
html[data-theme="light"] .data-table th{
  background:#eef1ee !important;
  color:#51605a !important;
  border-bottom:1px solid #cbd3ce !important;
}
html[data-theme="light"] .data-table td{border-bottom:1px solid #e0e4e1 !important}
html[data-theme="light"] .data-table tbody tr:hover{background:#f7f8f6 !important}
html[data-theme="light"] .standings-nav button{border-radius:3px !important}
html[data-theme="light"] .standings-nav button.active{background:#e8ece7 !important;border-color:#c9d1cc !important;color:#173f35 !important}

/* Modal */
html[data-theme="light"] .modal-card{
  border-radius:6px !important;
  box-shadow:0 18px 55px rgba(20,40,32,.18) !important;
  border:1px solid #bdc7c1 !important;
}
html[data-theme="light"] .modal-head{border-bottom:1px solid #d8dedb !important}
html[data-theme="light"] .modal-foot{border-top:1px solid #d8dedb !important}

/* Remove decorative / auto-generated feeling motion */
html[data-theme="light"] *{text-shadow:none !important}
html[data-theme="light"] .card:hover,
html[data-theme="light"] .metric:hover,
html[data-theme="light"] .court-card:hover{transform:none !important}

@media(max-width:900px){
  html[data-theme="light"] .main{padding:18px}
  html[data-theme="light"] .metrics{border-radius:4px}
}
@media(max-width:700px){
  html[data-theme="light"] .topbar{border-bottom-width:2px !important}
  html[data-theme="light"] .metric{border-right:0 !important;border-bottom:1px solid #d8dedb !important}
  html[data-theme="light"] .metric:last-child{border-bottom:0 !important}
}



/* ACMS Tournament Operations v2 — restrained, venue-first control room UI */
html[data-theme="light"],html[data-theme="dark"]{--sidebar:226px;--header:68px;--radius:7px}
body{font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif!important;font-feature-settings:"tnum" 1,"ss01" 1}
html[data-theme="light"]{--bg:#e9ece9;--bg2:#f5f6f4;--panel:#fff;--panel2:#f4f6f4;--surface:#f8f9f8;--surface2:#eef1ef;--text:#142821;--muted:#6c7872;--line:#d2d8d4;--line-strong:#aebbb4;--accent:#153d33;--gold:#b99342;--success:#2f7353;--danger:#a64040;--info:#44687e}
html[data-theme="dark"]{--bg:#111a17;--bg2:#15211d;--panel:#192721;--panel2:#1d2d27;--surface:#1d2a25;--surface2:#24342e;--text:#edf3ef;--muted:#9dacA5;--line:#30413a;--line-strong:#465a51;--accent:#d7c18a;--gold:#c9a85b;--success:#6ea985;--danger:#d87979;--info:#8cb3c8;--shadow:none}
html[data-theme="dark"] body{background:#111a17!important;background-image:none!important}
html[data-theme="dark"] .topbar{background:#0f2f27!important;border-bottom:2px solid #b99342!important;backdrop-filter:none!important}
html[data-theme="dark"] .sidebar{background:#14201c!important;border-right:1px solid #2a3a34!important;backdrop-filter:none!important}
html[data-theme="dark"] .card,html[data-theme="dark"] .settings-card,html[data-theme="dark"] .players-panel{background:#192721!important;background-image:none!important;box-shadow:none!important;border-color:#30413a!important}
html[data-theme="dark"] .nav-btn.active{background:#22322c!important;color:#fff!important}
html[data-theme="dark"] .nav-btn:hover{background:#1d2c27!important}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#15221d!important;color:#edf3ef!important;border-color:#3a4b44!important}
html[data-theme="dark"] .schedule-table th{background:#0f2f27!important;color:#fff!important}
html[data-theme="dark"] .schedule-table td{background:#17231f!important;border-color:#30413a!important}
html[data-theme="dark"] .schedule-table td:first-child{background:#13201c!important;color:#d7c18a!important}
html[data-theme="dark"] .slot{background:#1b2924!important;border-color:#34463e!important}
html[data-theme="dark"] .data-table th{background:#16241f!important;color:#b8c7c0!important}

/* Global reduction of template-like decoration */
.card,.btn,.event-chip,.nav-btn,.slot,.playing-card,.rest-row,.queue-row,.status,.availability{box-shadow:none!important}
.btn{font-weight:700;letter-spacing:0!important}
.main{max-width:1900px;width:100%}
.eyebrow{font-size:8px;line-height:1.2;font-weight:800;letter-spacing:.16em;color:var(--muted);margin-bottom:5px}
.section-head h1{font-size:26px!important;font-weight:760!important;letter-spacing:-.035em!important}
.section-head p{font-size:11px!important;max-width:760px}
.text-action{border:0;background:none;color:var(--accent);font:inherit;font-size:10px;font-weight:800;padding:4px 0;cursor:pointer}
.text-action:hover{text-decoration:underline}

/* Header */
.topbar{grid-template-columns:minmax(330px,1fr) auto auto!important;padding:0 18px!important}
.brand img{width:42px!important;height:42px!important}
.brand-copy b{font-size:13px!important}
.brand-copy span{font-size:8px!important;letter-spacing:.11em!important}
.event-chip{font-size:10px!important;font-weight:750!important}
.top-actions .btn{min-height:34px}

/* Navigation */
.side-label{font-size:7px!important;letter-spacing:.18em!important;margin-bottom:3px}
.nav-btn{font-size:11px!important;min-height:39px!important;font-weight:690!important}
.nav-icon{font-size:11px!important;opacity:.68}

/* Operational KPI strip */
.ops-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.ops-kpi{padding:13px 15px;border-right:1px solid var(--line);min-width:0}
.ops-kpi:last-child{border-right:0}
.ops-kpi small{display:block;font-size:7px;letter-spacing:.13em;font-weight:850;color:var(--muted)}
.ops-kpi strong{display:block;font-size:27px;line-height:1.05;letter-spacing:-.04em;margin:4px 0 2px;color:var(--text);font-weight:780}
.ops-kpi span{display:block;font-size:8px;color:var(--muted)}

/* Floor board */
.floor-board{padding:14px 15px;margin-bottom:12px}
.floor-board .panel-title{padding:0 0 10px;margin-bottom:10px}
.floor-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.floor-cell{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 7px;text-align:left;min-width:0;cursor:pointer;border-radius:3px;border-top:3px solid var(--line-strong)}
.floor-cell:hover{background:var(--surface2);border-color:var(--line-strong)}
.floor-cell span{display:block;font-size:8px;font-weight:900;color:var(--muted);letter-spacing:.08em}
.floor-cell b{display:block;font-size:9px;margin:3px 0 2px;letter-spacing:.06em}
.floor-cell small{display:block;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.floor-cell.live{border-top-color:#a64040}.floor-cell.ready{border-top-color:#2f7353}.floor-cell.rest{border-top-color:#b99342}.floor-cell.blocked,.floor-cell.hold{border-top-color:#8d6535}.floor-cell.pending{border-top-color:#44687e}.floor-cell.open{border-top-color:#aebbb4}

/* Dashboard */
.ops-dashboard{grid-template-columns:minmax(0,1.7fr) minmax(290px,.72fr)!important;gap:12px!important}
.director-column{display:grid;gap:12px;align-content:start}
.ops-timeline .timeline-row{grid-template-columns:68px minmax(0,1fr) auto!important}
.timeline-state{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.exception-list{display:grid}
.exception-row{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px 4px;text-align:left;cursor:pointer}
.exception-row:last-child{border-bottom:0}.exception-row:hover{background:var(--surface)}
.exception-row b{display:block;font-size:10px}.exception-row small{display:block;font-size:8px;color:var(--muted);margin-top:3px;line-height:1.35}
.exception-mark{width:4px;height:100%;min-height:30px;background:var(--line-strong)}
.exception-mark.resting{background:#b99342}.exception-mark.playing{background:#a64040}.exception-mark.checkin{background:#44687e}
.compact-activity .activity-row{padding:7px 0!important;background:transparent!important;border-bottom:1px solid var(--line);border-radius:0!important}
.empty.compact{padding:14px 2px;font-size:9px}

/* Match Control summary */
.control-summary{display:grid;grid-template-columns:repeat(4,90px) minmax(190px,1fr);border:1px solid var(--line);background:var(--panel);margin-bottom:12px;max-width:760px}
.control-summary>div{padding:9px 11px;border-right:1px solid var(--line)}
.control-summary>div:last-child{border-right:0}
.control-summary small{display:block;font-size:7px;font-weight:850;letter-spacing:.12em;color:var(--muted)}
.control-summary b{font-size:17px;letter-spacing:-.02em}
.control-rule{display:grid!important;grid-template-columns:auto auto 1fr;gap:7px;align-items:center}.control-rule small{grid-column:1/-1}.control-rule .text-action{justify-self:end}

/* Court grid optimized for a tournament desk */
.court-layout{grid-template-columns:minmax(0,1fr) 292px!important;gap:10px!important;align-items:start}
.court-layout.sidebar-off{grid-template-columns:minmax(0,1fr)!important}
.courts-grid{grid-template-columns:repeat(3,minmax(220px,1fr))!important;gap:8px!important}
.court-layout.sidebar-off .courts-grid{grid-template-columns:repeat(4,minmax(220px,1fr))!important}
.court-card{min-height:208px!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:0!important;overflow:hidden;border-top:3px solid var(--line-strong)!important}
.court-card.court-live{border-top-color:#a64040!important}.court-card.court-ready{border-top-color:#2f7353!important}.court-card.court-rest{border-top-color:#b99342!important}.court-card.court-hold,.court-card.court-blocked{border-top-color:#8d6535!important}.court-card.court-pending{border-top-color:#44687e!important}
.court-head{padding:10px 11px 8px!important;border-bottom:1px solid var(--line)}
.court-title{display:flex;align-items:baseline;gap:6px}.court-title span{font-size:7px;font-weight:900;letter-spacing:.15em;color:var(--muted)}.court-title b{font-size:22px!important;letter-spacing:-.05em;line-height:1}
.court-state{font-size:7px;font-weight:900;letter-spacing:.09em;border:1px solid var(--line);padding:4px 6px;border-radius:2px;color:var(--muted)}
.court-state.live{color:#94363b;border-color:#d3a2a4;background:#f7e9e9}.court-state.ready{color:#245f45;border-color:#9fc5ad;background:#e7f1eb}.court-state.resting{color:#755a19;border-color:#d7c28b;background:#f7f0de}
.court-context{padding:8px 11px 5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}.court-context b{font-size:8px;letter-spacing:.06em}.court-context span{font-size:7px;color:var(--muted);text-align:right}
.court-match{padding:0 11px 8px!important;gap:0!important;flex:1}
.teamline{border:0!important;border-top:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;padding:8px 0!important}.teamline:first-child{border-top:0!important}.teamline b,.team-primary{font-size:10px!important}.team-secondary{font-size:7px!important}.score{font-size:22px!important;letter-spacing:-.04em}
.court-block{margin-top:5px;border:0!important;border-left:3px solid var(--line-strong)!important;background:var(--surface)!important;border-radius:0!important;padding:7px 8px!important}.court-block b{display:block;font-size:9px}.court-block span{display:block;font-size:7px;color:var(--muted);margin-top:2px;line-height:1.35}.live-time{border-left-color:#a64040!important}.live-time b{font-size:14px;color:#8e3439}
.court-actions{border-top:1px solid var(--line);padding:8px 10px!important;margin-top:auto!important}.court-actions .btn:first-child{margin-right:auto}.court-actions .btn.success{background:#2f7353!important;color:#fff!important;border-color:#2f7353!important}
.court-empty{padding:22px 12px;display:grid;gap:4px}.court-empty b{font-size:10px}.court-empty span{font-size:8px;color:var(--muted)}

/* Player side panel */
.players-panel{top:calc(var(--header) + 10px)!important;max-height:calc(100vh - var(--header) - 24px)!important;padding:12px!important}
.player-watch-section+.player-watch-section{margin-top:13px}.watch-label{font-size:7px;letter-spacing:.15em;font-weight:900;color:var(--muted);padding:2px 0 6px;border-bottom:1px solid var(--line)}
.playing-card{display:block;width:100%;text-align:left;color:var(--text);border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;padding:9px 2px!important;cursor:pointer}.playing-card:hover{background:var(--surface)!important}.playing-card ul{margin:5px 0 0!important;padding-left:14px!important}.playing-card li{font-size:8px!important}
.rest-row{border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;padding:9px 2px!important}.rest-row strong{font-size:11px;color:#7c5d18}

/* Queue becomes a dense operations table */
.queue-panel{margin-top:12px!important}
.queue-table{gap:0!important;border:1px solid var(--line);border-bottom:0}
.queue-header,.queue-row{display:grid!important;grid-template-columns:36px minmax(260px,1fr) 92px 180px 54px!important;gap:10px!important;align-items:center!important}
.queue-header{padding:7px 9px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:7px;font-weight:850;letter-spacing:.11em;color:var(--muted)}
.queue-row{border:0!important;border-bottom:1px solid var(--line)!important;padding:8px 9px!important;background:var(--panel)!important}
.queue-row:hover{background:var(--surface)!important}.queue-order{width:25px!important;height:25px!important;border-radius:2px!important;font-size:8px!important}.queue-schedule b{display:block;font-size:9px}.queue-schedule small,.queue-status small{display:block;font-size:7px!important;color:var(--muted);margin-top:3px;line-height:1.3}.queue-status .availability{margin-bottom:2px}

/* Schedule – denser, frozen time rail */
.schedule-table th{height:36px}.schedule-table td:first-child{position:sticky;left:0;z-index:4;box-shadow:1px 0 0 var(--line)}
.schedule-table th:first-child{position:sticky;left:0;z-index:7}
.schedule-table td{height:104px!important;min-width:110px!important}.slot{min-height:94px!important;padding:6px 6px 6px 9px!important}
.slot:hover{transform:none!important}

/* Live view */

  --v3-line-strong:#3a3a3c;
  --v3-green:#64b99c;
  --v3-green-2:#80cdb2;
  --v3-green-soft:#17362d;
  --v3-gold:#e2bb66;
  --v3-gold-soft:#382e18;
  --v3-blue:#6ea0ff;
  --v3-blue-soft:#172642;
  --v3-red:#ff6b61;
  --v3-red-soft:#351c1a;

.schedule-table thead th:first-child{left:0!important;z-index:12!important;min-width:90px!important}
.schedule-table tbody td{padding:4px!important;border-right:1px solid var(--v3-line)!important;border-bottom:1px solid var(--v3-line)!important;background:var(--v3-surface)!important;vertical-align:top!important}
.schedule-table tbody td:first-child{position:sticky!important;left:0!important;z-index:8!important;background:var(--v3-surface-2)!important;font-size:9px!important;font-weight:700!important;color:var(--v3-text-2)!important;min-width:90px!important;padding:8px!important}

/* Modal becomes a contextual side sheet */
.modal-backdrop{justify-content:flex-end!important;align-items:stretch!important;background:rgba(0,0,0,.28)!important;backdrop-filter:blur(4px)!important;padding:0!important}

/* Toast */
.toast{background:color-mix(in srgb,var(--v3-text) 92%,transparent)!important;color:var(--v3-surface)!important;border:0!important;border-radius:9px!important;box-shadow:var(--v3-shadow-float)!important;font-size:10px!important;padding:9px 12px!important}

/* ================================================================
   ACMS CLASSIC OPS v4
   Visual language restored from the earlier Qourts/Dinkaholics
   tournament-control interface while retaining Tournament OS v3
   logic: actual timestamps, configurable rest, Ready to Call,
   Hold/Result Pending pinning, check-in, scoring guards and focus.
   ================================================================ */

html[data-theme="light"]{
  --bg:#f7f0e4;
  --bg2:#fffaf1;
  --panel:#fffdf8;
  --panel2:#fbf5e9;
  --surface:#fffaf2;
  --surface2:#f6ecdc;
  --text:#183b32;
  --muted:#7c786e;
  --line:#e5dac7;
  --line-strong:#d2c1a6;
  --accent:#c9562b;
  --gold:#d7ad45;
  --success:#4f7d55;
  --danger:#bd4f38;
  --info:#477b8a;
  --sidebar:216px;
  --header:68px;
  --radius:9px;
  --classic-green:#082842;
  --classic-green-2:#123f37;
  --classic-cream:#fbf3e6;
  --classic-orange:#c9552a;
  --classic-gold:#d7b34d;
}

html[data-theme="light"] body{
  background:#f7f0e4!important;
  background-image:radial-gradient(circle at 75% -10%,rgba(211,171,77,.08),transparent 26%)!important;
  color:#183b32!important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif!important;
}

/* --- App frame / header ------------------------------------------------ */
html[data-theme="light"] .app{grid-template-columns:var(--sidebar) minmax(0,1fr)!important;grid-template-rows:var(--header) minmax(0,1fr)!important}
html[data-theme="light"] .topbar{
  height:var(--header)!important;
  grid-template-columns:minmax(280px,1fr) minmax(360px,.9fr) minmax(280px,1fr)!important;
  gap:14px!important;
  padding:0 18px!important;
  background:rgba(255,251,243,.98)!important;
  border:0!important;
  border-bottom:1px solid #eadfce!important;
  box-shadow:0 4px 18px rgba(77,59,33,.07)!important;
  backdrop-filter:blur(12px)!important;
}
html[data-theme="light"] .brand{gap:10px!important}
html[data-theme="light"] .brand img{width:44px!important;height:44px!important;filter:none!important}
html[data-theme="light"] .brand-copy b{font-size:14px!important;color:#183f35!important;font-weight:900!important;letter-spacing:-.015em!important}
html[data-theme="light"] .brand-copy span{margin-top:2px!important;color:#8a8071!important;font-size:8px!important;letter-spacing:.13em!important;font-weight:800!important}
html[data-theme="light"] .event-chip{
  justify-self:center!important;
  justify-content:center!important;
  gap:8px!important;
  min-width:340px!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  text-align:center!important;
}
html[data-theme="light"] .event-chip .pulse{width:7px!important;height:7px!important;box-shadow:none!important;background:#78954b!important}
html[data-theme="light"] .event-copy{display:grid!important;gap:2px!important}
html[data-theme="light"] .event-copy b{font-size:12px!important;color:#173f35!important;line-height:1.15!important;font-weight:900!important}
html[data-theme="light"] .event-copy small{font-size:7.5px!important;color:#b05231!important;font-weight:900!important;text-transform:uppercase!important;letter-spacing:.16em!important}
html[data-theme="light"] .top-actions{justify-self:end!important;align-items:center!important;gap:8px!important}
html[data-theme="light"] .top-actions .btn{height:36px!important;padding:0 12px!important;background:#fffdf8!important;border:1px solid #dfd6c9!important;color:#173f35!important;border-radius:9px!important;box-shadow:0 2px 7px rgba(68,54,34,.035)!important}
html[data-theme="light"] .top-actions .btn:hover{background:#fff8ec!important;border-color:#cab99f!important;transform:none!important}
html[data-theme="light"] .theme-toggle{min-width:58px!important}

/* --- Sidebar ---------------------------------------------------------- */
html[data-theme="light"] .sidebar{
  top:var(--header)!important;
  height:calc(100vh - var(--header))!important;
  padding:18px 10px 20px!important;
  background:linear-gradient(180deg,#0e4a40 0%,#0c4037 52%,#0a3a32 100%)!important;
  border-right:1px solid rgba(0,0,0,.06)!important;
  box-shadow:8px 0 24px rgba(29,55,45,.08)!important;
  backdrop-filter:none!important;
}
html[data-theme="light"] .side-label{padding:8px 10px 7px!important;color:#d7c98f!important;font-size:7.5px!important;letter-spacing:.17em!important;font-weight:900!important}
html[data-theme="light"] .nav-btn{
  min-height:38px!important;
  gap:9px!important;
  margin:2px 0!important;
  padding:9px 10px!important;
  border-radius:8px!important;
  color:#e1eee8!important;
  font-size:10px!important;
  font-weight:750!important;
  border:1px solid transparent!important;
  transition:background .14s ease,border-color .14s ease,color .14s ease!important;
}
html[data-theme="light"] .nav-btn:hover{background:rgba(255,255,255,.065)!important;color:#fff!important;transform:none!important}
html[data-theme="light"] .nav-btn.active{
  background:linear-gradient(90deg,rgba(216,179,75,.20),rgba(255,255,255,.055))!important;
  color:#fff!important;
  border-color:rgba(255,255,255,.03)!important;
  box-shadow:inset 3px 0 0 #e1b946!important;
}
html[data-theme="light"] .nav-icon{width:20px!important;color:#d8b349!important;font-size:10px!important}
html[data-theme="light"] .classic-brand-card{
  margin-top:20px!important;
  padding:12px 12px 13px!important;
  border:1px solid rgba(255,255,255,.16)!important;
  border-radius:12px!important;
  background:rgba(255,255,255,.045)!important;
  box-shadow:none!important;
  text-align:left!important;
}
html[data-theme="light"] .classic-brand-card small{color:#d9d9c9!important;font-size:7px!important;letter-spacing:.13em!important}
html[data-theme="light"] .classic-brand-card img{width:94px!important;height:94px!important;max-width:none!important;max-height:none!important;margin:10px auto 8px!important;object-fit:contain!important;filter:drop-shadow(0 5px 8px rgba(0,0,0,.12))!important}
html[data-theme="light"] .classic-brand-card b{color:#fff!important;font-size:9px!important;line-height:1.25!important;text-align:center!important}
html[data-theme="light"] .classic-brand-card span{display:block;margin-top:5px;color:#c5d7d1!important;font-size:7.5px!important;text-align:center!important}

/* --- Main workspace --------------------------------------------------- */
html[data-theme="light"] .main{padding:18px 20px 38px!important;background:transparent!important}
html[data-theme="light"] .section-head{align-items:flex-end!important;gap:14px!important;margin-bottom:14px!important}
html[data-theme="light"] .section-head h1{font-family:Georgia,"Times New Roman",serif!important;font-size:25px!important;line-height:1.05!important;letter-spacing:-.025em!important;color:#163f35!important;font-weight:800!important}
html[data-theme="light"] .section-head p{max-width:740px!important;margin-top:5px!important;color:#8a8176!important;font-size:9.5px!important;line-height:1.45!important}
html[data-theme="light"] .eyebrow{color:#b8663c!important;font-size:7.5px!important;letter-spacing:.16em!important;font-weight:900!important;text-transform:uppercase!important;margin-bottom:4px!important}
html[data-theme="light"] .head-actions{gap:7px!important}

html[data-theme="light"] .card,
html[data-theme="light"] .settings-card,
html[data-theme="light"] .players-panel{
  border:1px solid #e3d8c7!important;
  border-radius:10px!important;
  background:#fffdf8!important;
  background-image:none!important;
  box-shadow:0 4px 14px rgba(68,52,29,.045)!important;
}
html[data-theme="light"] .panel{padding:13px!important}
html[data-theme="light"] .panel-title{margin-bottom:10px!important}
html[data-theme="light"] .panel-title h2,html[data-theme="light"] .panel-title h3{color:#173f35!important;font-size:13px!important;font-weight:900!important}
html[data-theme="light"] .panel-title small{font-size:8px!important;color:#8b8071!important}

/* --- Buttons / fields ------------------------------------------------- */
html[data-theme="light"] .btn{
  border:1px solid #dbd2c3!important;
  border-radius:8px!important;
  background:#fffdf8!important;
  background-image:none!important;
  color:#173f35!important;
  padding:8px 11px!important;
  font-size:9px!important;
  font-weight:850!important;
  box-shadow:0 2px 6px rgba(66,49,25,.035)!important;
  transition:background .13s ease,border-color .13s ease,box-shadow .13s ease!important;
}
html[data-theme="light"] .btn:hover{background:#fff7e9!important;border-color:#cbbb9f!important;transform:none!important;box-shadow:0 3px 8px rgba(66,49,25,.06)!important}
html[data-theme="light"] .btn.primary{background:#c8562b!important;border-color:#c8562b!important;color:#fff!important;box-shadow:0 5px 14px rgba(193,74,34,.17)!important}
html[data-theme="light"] .btn.success{background:#176653!important;border-color:#176653!important;color:#fff!important}
html[data-theme="light"] .btn.danger{background:#b94f35!important;border-color:#b94f35!important;color:#fff!important}
html[data-theme="light"] .btn.tiny{padding:6px 8px!important;border-radius:7px!important;font-size:8px!important}
html[data-theme="light"] .text-action{color:#9e582f!important;font-size:8px!important;font-weight:900!important}
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea,
html[data-theme="light"] .toolbar input,html[data-theme="light"] .toolbar select{
  background:#fffdf8!important;
  border:1px solid #dbd2c3!important;
  border-radius:7px!important;
  color:#1c3e35!important;

.modal-backdrop{

  display:none!important;
  align-items:center!important;
  justify-content:center!important;
  place-items:center!important;
  padding:clamp(12px,2.5vw,24px)!important;
  overflow:auto!important;
  overscroll-behavior:contain;
}

.modal{
  width:min(780px,calc(100vw - 24px))!important;

  margin:auto!important;

}

  min-height:0!important;

  overscroll-behavior:contain;

function stageRules(m){if(m.kind==='prelim')return{target:11,mode:'prelim'};if(m.stage?.includes('Semifinal'))return{target:11,winBy:2,max:15,mode:'semi'};return{target:15,winBy:2,mode:'medal'}}
function validScore(m,a,b){if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a===b)return false;const hi=Math.max(a,b),lo=Math.min(a,b),r=stageRules(m);if(r.mode==='prelim')return hi===11&&lo<=10;if(r.mode==='semi'){if(hi<11||hi>15||lo>14)return false;if(hi===15)return hi-lo>=1;return hi-lo>=2}return hi>=15&&hi-lo>=2}

function standingsFor(div,br){const teams=BASE_DATA.teams.filter(t=>t.division===div&&t.bracket===br);const rows=teams.map(t=>({code:t.code,hospital:t.hospital,w:0,l:0,pe:0,pc:0,gp:0,rate:0,pq:0}));const map=Object.fromEntries(rows.map(r=>[r.code,r]));for(const m of completedPrelim().filter(m=>m.division===div&&m.bracket===br)){const a=map[m.teamA],b=map[m.teamB];if(!a||!b)continue;const w=matchWinner(m);a.gp++;b.gp++;if(w===a.code){a.w++;b.l++}else{b.w++;a.l++}if(Number.isFinite(m.scoreA)&&Number.isFinite(m.scoreB)){a.pe+=m.scoreA;a.pc+=m.scoreB;b.pe+=m.scoreB;b.pc+=m.scoreA}else if(m.status==='Forfeit'&&state.settings?.forfeitPQPolicy==='target_zero'){const target=11;if(w===a.code){a.pe+=target;b.pc+=target}else{b.pe+=target;a.pc+=target}}}
 rows.forEach(r=>{r.rate=r.gp?r.w/r.gp:0;r.pq=(r.pe+r.pc)?r.pe/(r.pe+r.pc):0;r.pepg=r.gp?r.pe/r.gp:0;r.pcpg=r.gp?r.pc/r.gp:0});

function bracketRoundRobinIntegrity(div,br){const teams=BASE_DATA.teams.filter(t=>t.division===div&&t.bracket===br).map(t=>t.code).sort(),expected=[];for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++)expected.push([teams[i],teams[j]]);const matches=state.matches.filter(m=>m.division===div&&m.bracket===br&&m.teamA&&m.teamB);const key=(a,b)=>[a,b].sort().join('|'),counts={};matches.forEach(m=>counts[key(m.teamA,m.teamB)]=(counts[key(m.teamA,m.teamB)]||0)+1);const missing=expected.filter(([a,b])=>!counts[key(a,b)]),duplicates=Object.entries(counts).filter(([,n])=>n>1).map(([k,n])=>({pair:k.split('|'),count:n}));const unexpected=matches.filter(m=>!teams.includes(m.teamA)||!teams.includes(m.teamB));const complete=expected.length>0&&!missing.length&&!duplicates.length&&!unexpected.length&&matches.length===expected.length&&matches.every(m=>['Completed','Forfeit'].includes(m.status)&&matchWinner(m));return{teams,expectedCount:expected.length,matchCount:matches.length,missing,duplicates,unexpected,complete}}

function sameStandingMetric(a,b){return Boolean(a&&b&&Math.abs(a.rate-b.rate)<1e-12&&Math.abs(a.pq-b.pq)<1e-12)}

function sameWinnerSeedMetric(a,b){return Boolean(a&&b&&Math.abs(a.rate-b.rate)<1e-12&&Math.abs(a.pq-b.pq)<1e-12&&Math.abs(a.pcpg-b.pcpg)<1e-12&&Math.abs(a.pepg-b.pepg)<1e-12)}

function winnerSeedOrder(div,winners){const sorted=[...winners].sort(winnerSeedCompare),ties=[];let i=0;while(i<sorted.length){let j=i+1;while(j<sorted.length&&sameWinnerSeedMetric(sorted[i],sorted[j]))j++;if(j-i>1){const group=sorted.slice(i,j),codes=group.map(r=>r.code),override=state.settings?.winnerSeedDrawOverrides?.[div];if(Array.isArray(override)&&sameCodeSet(override,codes)){const pos=Object.fromEntries(override.map((code,idx)=>[code,idx]));group.sort((a,b)=>pos[a.code]-pos[b.code]);sorted.splice(i,group.length,...group)}else ties.push(group)}i=j}return{seeds:sorted,ties}}

function unresolvedStandingIssues(standings){const issues=[];for(const [br,rows] of Object.entries(standings)){let i=0;while(i<rows.length){let j=i+1;while(j<rows.length&&Math.abs(rows[j].rate-rows[i].rate)<1e-12)j++;let x=i;while(x<j){let y=x+1;while(y<j&&Math.abs(rows[y].pq-rows[x].pq)<1e-12)y++;if(y-x>=3&&x<2)issues.push({bracket:br,codes:rows.slice(x,y).map(r=>r.code),rate:rows[x].rate,pq:rows[x].pq});x=y}i=j}}return issues}
function qualificationForDivision(div){
 const brackets=divisionBrackets(div),ready=divisionPrelimsComplete(div);
 const standings=Object.fromEntries(brackets.map(br=>[br,standingsFor(div,br).map(r=>({...r,bracket:br}))]));
 const result={division:div,brackets,ready,standings,qualifiers:[],wildcardCandidates:[],wildcard:null,wildcardTie:[],winnerSeeds:[],winnerSeedTie:[],wildcardOpponent:null,pairings:[],unresolvedStandings:[],pairingTie:[]};

  const A=standings[brackets[0]]||[],B=standings[brackets[1]]||[];
  result.qualifiers=[A[0],A[1],B[0],B[1]].filter(Boolean);
  result.pairings=[{a:A[0]?.code||'',b:B[1]?.code||'',label:`${brackets[0]}1 vs ${brackets[1]}2`},{a:B[0]?.code||'',b:A[1]?.code||'',label:`${brackets[1]}1 vs ${brackets[0]}2`}];
  return result;
 }
 if(brackets.length===3){
  const winners=brackets.map(br=>standings[br]?.[0]).filter(Boolean);
  const runners=brackets.map(br=>standings[br]?.[1]).filter(Boolean).sort(wildcardCompare);
  result.wildcardCandidates=runners;
  if(runners.length){const best=runners[0];const tied=runners.filter(r=>sameStandingMetric(r,best));result.wildcardTie=tied;const override=state.settings?.wildcardOverrides?.[div];result.wildcard=tied.length>1?(tied.find(r=>r.code===override)||null):best}
  const seedOrder=winnerSeedOrder(div,winners);result.winnerSeeds=seedOrder.seeds;result.winnerSeedTie=seedOrder.ties[0]||[];result.qualifiers=[...winners,...(result.wildcard?[result.wildcard]:[])];
  if(result.wildcard&&result.winnerSeeds.length===3&&!result.winnerSeedTie.length){
   const eligible=result.winnerSeeds.filter(w=>w.bracket!==result.wildcard.bracket);
   const opponent=eligible[0]||null,remaining=result.winnerSeeds.filter(w=>w.code!==opponent?.code);result.wildcardOpponent=opponent;
   if(opponent&&remaining.length===2){result.pairings=[{a:opponent.code,b:result.wildcard.code,label:`${opponent.bracket}1 vs Wildcard ${result.wildcard.bracket}2`,reason:'Wildcard faces the highest-seeded bracket winner from a different bracket.'},{a:remaining[0].code,b:remaining[1].code,label:`${remaining[0].bracket}1 vs ${remaining[1].bracket}1`,reason:'The two remaining bracket winners face each other.'}]}
  }

}

function courtStripHtml(){return `<div class="floor-strip">${floorSnapshot().map(x=>`<button class="floor-cell ${x.state}" ${x.m?`onclick="openMatch('${x.m.id}')"`:''}><span>C${x.court}</span><b>${x.label}</b>${x.m?`<small>${esc(x.m.id)}</small>`:'<small>No assignment</small>'}</button>`).join('')}</div>`}
function uncheckedTeamsForUpcoming(limit=12){const codes=new Set();for(const m of scheduledMatches().filter(x=>x.status==='Scheduled').slice(0,limit)){if(m.teamA&&!state.checkin[m.teamA])codes.add(m.teamA);if(m.teamB&&!state.checkin[m.teamB])codes.add(m.teamB)}return [...codes]}
function dashboard(){const summary=opsSummary(),checked=Object.values(state.checkin).filter(Boolean).length,total=BASE_DATA.teams.length,upcoming=scheduledMatches().filter(m=>m.status==='Scheduled').slice(0,7),blocked=upcoming.map(m=>({m,a:matchAvailability(m)})).filter(x=>x.a.state!=='ready'),unchecked=uncheckedTeamsForUpcoming();return`<div class="section-head"><div><div class="eyebrow">ACMS · TOURNAMENT DESK</div><h1>Tournament Operations</h1><p>Live floor status, match calls, check-in readiness and result progression.</p></div><div class="head-actions"><button class="btn" onclick="setSection('schedule')">Schedule</button><button class="btn primary" onclick="setSection('matches')">Match Control</button></div></div><div class="ops-kpis"><div class="ops-kpi"><small>LIVE COURTS</small><strong>${summary.live}</strong><span>${10-summary.live} not live</span></div><div class="ops-kpi"><small>READY TO CALL</small><strong>${summary.ready}</strong><span>${summary.rest+summary.busy+summary.checkin+summary.courtBusy+summary.unassigned} blocked</span></div><div class="ops-kpi"><small>REST HOLD</small><strong>${summary.rest}</strong><span>${restMinutes()} min rule</span></div><div class="ops-kpi"><small>CHECKED IN</small><strong>${checked}/${total}</strong><span>${Math.round(checked/Math.max(total,1)*100)}% of teams</span></div><div class="ops-kpi"><small>COMPLETED</small><strong>${summary.done}</strong><span>${allMatches().length-summary.done} remaining</span></div></div><div class="card floor-board"><div class="panel-title"><div><div class="eyebrow">COURT BOARD</div><h2>Floor Status</h2></div><small>Click a court to open Match Control</small></div>${courtStripHtml()}</div><div class="dashboard-grid ops-dashboard"><div class="card panel"><div class="panel-title"><div><div class="eyebrow">CALL ORDER</div><h2>Next Matches</h2></div><button class="text-action" onclick="setSection('matches')">Open full queue →</button></div><div class="timeline ops-timeline">${upcoming.length?upcoming.map(m=>{const a=matchAvailability(m);return`<div class="timeline-row"><b>${esc(m.time)}</b><div><b>${esc(matchPrimaryText(m))}</b>${matchSecondaryText(m)?`<span class="match-meta-pair">${esc(matchSecondaryText(m))}</span>`:''}<span>Court ${m.court} · ${esc(m.division)} · ${esc(m.stage)}</span></div><div class="timeline-state">${availabilityHtml(m)}<button class="btn tiny" onclick="openMatch('${m.id}')">Open</button></div></div>`}).join(''):'<div class="empty">No scheduled matches remaining.</div>'}</div></div><div class="director-column"><div class="card panel"><div class="panel-title"><div><div class="eyebrow">EXCEPTIONS</div><h2>Needs Attention</h2></div><small>${blocked.length+unchecked.length} items</small></div><div class="exception-list">${blocked.slice(0,5).map(({m,a})=>`<button class="exception-row" onclick="openMatch('${m.id}')"><span class="exception-mark ${a.state}"></span><div><b>${esc(m.id)} · Court ${m.court}</b><small>${esc(a.details?.[0]||a.label)}</small></div></button>`).join('')}${unchecked.length?`<button class="exception-row" onclick="setSection('teams')"><span class="exception-mark checkin"></span><div><b>${unchecked.length} upcoming team${unchecked.length===1?'':'s'} not checked in</b><small>${esc(unchecked.slice(0,6).join(', '))}${unchecked.length>6?'…':''}</small></div></button>`:''}${!blocked.length&&!unchecked.length?'<div class="empty compact">No immediate blockers.</div>':''}</div></div><div class="card panel"><div class="panel-title"><div><div class="eyebrow">AUDIT</div><h3>Recent Activity</h3></div></div><div class="activity compact-activity">${state.activity.slice(0,6).map(a=>`<div class="activity-row"><b>${esc(a.text)}</b><span>${esc(fmtTime(a.time))}</span></div>`).join('')}</div></div></div></div>`}
function currentForCourt(c){const matches=scheduledMatches();const active=matches.find(m=>m.court===c&&m.status==='Live');if(active)return active;const held=matches.find(m=>m.court===c&&m.status==='Hold');if(held)return held;const pending=matches.find(m=>m.court===c&&m.status==='Result Pending');if(pending)return pending;return matches.find(m=>m.court===c&&m.status==='Scheduled')||null}
function courtCard(c){const m=currentForCourt(c);if(!m)return`<div class="card court-card court-open"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state open">OPEN</span></div><div class="court-empty"><b>No active assignment</b><span>Waiting for the next scheduled match.</span></div></div>`;const avail=m.status==='Scheduled'?matchAvailability(m):null;const cls=m.status==='Live'?'court-live':m.status==='Hold'?'court-hold':m.status==='Result Pending'?'court-pending':avail?.state==='ready'?'court-ready':avail?.state==='resting'?'court-rest':avail?.state==='playing'?'court-blocked':'court-queued';const stateLabel=m.status==='Scheduled'?(avail?.label||'QUEUED'):m.status.toUpperCase();return`<div class="card court-card ${cls}"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state ${statusClass(stateLabel)}">${esc(stateLabel)}</span></div><div class="court-context"><b>${esc(m.id)}</b><span>${esc(m.time)} · ${esc(m.division)} · ${esc(m.stage)}</span></div><div class="court-match"><div class="teamline"><div>${teamDisplayInline(m.teamA)}</div><span class="score">${m.scoreA??'—'}</span></div><div class="teamline"><div>${teamDisplayInline(m.teamB)}</div><span class="score">${m.scoreB??'—'}</span></div>${m.status==='Live'?`<div class="court-block live-time"><b class="live-elapsed-clock" data-elapsed-start="${esc(m.actualStartAt||'')}" data-elapsed-end="">${esc(elapsedText(m.actualStartAt,null))}</b><span>Started ${esc(fmtTime(m.actualStartAt))}</span></div>`:m.status==='Hold'?`<div class="court-block"><b>Match on hold</b><span>Resume from Match Control when cleared.</span></div>`:m.status==='Result Pending'?`<div class="court-block"><b>Result pending</b><span>Finalize the score before releasing this court.</span></div>`:avail?`<div class="queue-state">${availabilityHtml(m)}</div>${avail.state!=='ready'?`<div class="court-block"><span>${avail.details.map(esc).join('<br>')}</span></div>`:''}`:''}</div><div class="court-actions"><button class="btn tiny" onclick="openMatch('${m.id}')">Control</button>${m.status==='Scheduled'?`<button class="btn tiny success" ${avail?.state==='ready'?'':`disabled title="Players are not yet eligible"`} onclick="quickStart('${m.id}')">Start Match</button>`:''}</div></div>`}
function playersPanel(){const live=allMatches().filter(m=>m.status==='Live').sort((a,b)=>a.court-b.court);const resting=[];const seen=new Set();for(const m of allMatches().filter(x=>x.actualStartAt&&x.actualEndAt&&['Result Pending','Completed','Forfeit'].includes(x.status))){for(const p of matchPlayers(m)){if(seen.has(p))continue;seen.add(p);const a=playerAvailability(p,'__none__');if(a.state==='resting')resting.push(a)}}resting.sort((a,b)=>new Date(a.readyAt)-new Date(b.readyAt));return`<aside class="card players-panel"><div class="panel-title"><div><div class="eyebrow">PLAYER WATCH</div><h3>Availability</h3></div><span class="status live">${live.length} LIVE</span></div><div class="player-watch-section"><div class="watch-label">NOW PLAYING</div>${live.length?live.map(m=>`<button class="playing-card" onclick="openMatch('${m.id}')"><div><b>Court ${m.court} · ${esc(m.id)}</b><small class="live-elapsed-clock" data-elapsed-start="${esc(m.actualStartAt||'')}" data-elapsed-end="">${esc(elapsedText(m.actualStartAt,null))}</small></div><ul>${matchPlayers(m).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></button>`).join(''):'<div class="empty compact">No live matches.</div>'}</div><div class="player-watch-section"><div class="watch-label">RECOVERY WINDOW</div>${resting.length?resting.map(a=>`<div class="rest-row"><div><b>${esc(a.player)}</b><span>${esc(a.match.id)} · ready ${esc(fmtTime(a.readyAt))}</span></div><strong>${Math.max(0,Math.ceil((new Date(a.readyAt)-Date.now())/60000))}m</strong></div>`).join(''):'<div class="empty compact">No active recovery holds.</div>'}</div></aside>`}
function queueHtml(){const q=scheduledMatches().filter(m=>m.status==='Scheduled').slice(0,18);const nextEligible=q.find(m=>matchAvailability(m).state==='ready');return`<div class="card panel queue-panel"><div class="panel-title"><div><div class="eyebrow">CALL QUEUE</div><h2>Upcoming Matches</h2></div>${nextEligible?`<small>Next eligible: ${esc(nextEligible.id)} · Court ${nextEligible.court}</small>`:'<small>No match currently eligible</small>'}</div><div class="queue queue-table"><div class="queue-header"><span>#</span><span>Match</span><span>Schedule</span><span>Status</span><span></span></div>${q.map((m,i)=>{const a=matchAvailability(m);return`<div class="queue-row"><div class="queue-order">${i+1}</div><div><b>${esc(matchPrimaryText(m))}</b>${matchSecondaryText(m)?`<small>${esc(matchSecondaryText(m))}</small>`:''}<small>${esc(m.id)} · ${esc(m.division)} · ${esc(m.stage)}</small></div><div class="queue-schedule"><b>${esc(m.time)}</b><small>Court ${m.court}</small></div><div class="queue-status">${availabilityHtml(m)}${a.state!=='ready'?`<small>${esc(a.details?.[0]||'Waiting')}</small>`:''}</div><button class="btn tiny" onclick="openMatch('${m.id}')">Open</button></div>`}).join('')}</div></div>`}
function unscheduledMatchesHtml(){const list=allMatches().filter(m=>m.removedFromSchedule);if(!list.length)return'';return `<div class="card panel unscheduled-panel"><div class="panel-title"><div><div class="eyebrow">MATCH CONTROL RECORDS</div><h2>Unscheduled Matches</h2></div><small>${list.length} retained record${list.length===1?'':'s'} · not occupying a court/time</small></div><div class="unscheduled-list">${list.map(m=>`<div class="unscheduled-row"><div><b>${esc(m.id)} · ${esc(matchPrimaryText(m))}</b>${matchSecondaryText(m)?`<small>${esc(matchSecondaryText(m))}</small>`:''}<small>${esc(m.division)} · ${esc(m.stage)} · previous slot ${esc(m.time)} / Court ${m.court}</small></div><span class="availability unscheduled">UNSCHEDULED</span><button class="btn tiny" onclick="openMatch('${m.id}')">Open</button></div>`).join('')}</div></div>`} 
function matchControl(){const summary=opsSummary();return`<div class="section-head"><div><div class="eyebrow">FLOOR CONTROL</div><h1>Match Control</h1><p>One court card per physical court. Live, held and result-pending matches stay pinned until resolved.</p></div><div class="head-actions"><button class="btn" onclick="togglePlayersPanel()">${state.settings.playersPanel?'Hide':'Show'} Player Status</button></div></div><div class="control-summary"><div><small>LIVE</small><b>${summary.live}</b></div><div><small>READY</small><b>${summary.ready}</b></div><div><small>RESTING</small><b>${summary.rest}</b></div><div><small>BLOCKED</small><b>${summary.busy}</b></div><div class="control-rule"><small>PLAYER REST</small><b>${restMinutes()} min</b><button class="text-action" onclick="setSection('settings')">Change</button></div></div><div class="court-layout ${state.settings.playersPanel?'':'sidebar-off'}"><div class="courts-grid">${Array.from({length:10},(_,i)=>courtCard(i+1)).join('')}</div>${state.settings.playersPanel?playersPanel():''}</div>${queueHtml()}${unscheduledMatchesHtml()}`}
function schedule(){const division=document.getElementById('scheduleDivision')?.value||'All';const active=scheduledMatches();const list=active.filter(m=>division==='All'||m.division===division);const times=[...new Set([...SCHEDULE_EVENTS.map(e=>e.time),...active.map(m=>m.time)])].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));const divs=[...new Set(BASE_DATA.teams.map(t=>t.division))];return`<div class="section-head"><div><h1>Schedule</h1><p>Official 10-court ACMS schedule matrix. Cards show player names only; tap any match for team code, hospital, and Match Control details.</p></div><div class="head-actions"><select id="scheduleDivision" onchange="renderScheduleOnly()"><option>All</option>${divs.map(d=>`<option ${division===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div></div><div class="schedule-source"><b>Source of truth:</b><span>ACMS Inter-Hospital Pickleball Tournament 2026 — Proposed Schedule Matrix, prepared by Qourts PH.</span><span>80 preliminary matches · 16 playoff/medal slots</span></div><div class="schedule-legend"><span class="iw"><i></i>Intermediate Women's</span><span class="im"><i></i>Intermediate Men's</span><span class="nm"><i></i>Novice Men's</span><span class="nw"><i></i>Novice Women's</span></div><div class="schedule-wrap"><table class="schedule-table"><thead><tr><th>Time</th>${Array.from({length:10},(_,i)=>`<th>Court ${i+1}</th>`).join('')}</tr></thead><tbody>${times.map(time=>{const ev=SCHEDULE_EVENTS.find(e=>e.time===time);if(ev)return`<tr class="schedule-event-row"><td>${esc(time)}</td><td colspan="10" class="schedule-event-cell"><div class="schedule-event ${ev.type}">${esc(ev.label)}</div></td></tr>`;return`<tr><td>${esc(time)}</td>${Array.from({length:10},(_,i)=>{const m=list.find(x=>x.time===time&&x.court===i+1);return`<td>${m?`<div class="slot ${divisionSlotClass(m.division)} ${m.kind==='playoff'?'playoff':''} ${m.status==='Live'?'live':''}${scheduleCardClass(m)}"${scheduleCardStyle(m)} onclick="openMatch('${m.id}')">${teamSlotHtml(m.teamA)}<div class="slot-vs">vs</div>${teamSlotHtml(m.teamB)}<small>${esc(m.division)} · ${esc(m.stage)}</small><small>${esc(m.status)} ${m.scoreA!=null?'· '+esc(scoreText(m)):''}</small></div>`:''}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>`}
function standingsSection(){
 const divisions=[...new Set(BASE_DATA.teams.map(t=>t.division))];
 if(activeStandingsDivision!=='All'&&!divisions.includes(activeStandingsDivision))activeStandingsDivision='All';
 const visibleDivisions=activeStandingsDivision==='All'?divisions:[activeStandingsDivision];
 const cards=[];
 visibleDivisions.forEach(div=>{
  divisionBrackets(div).forEach(br=>{
   const rows=standingsFor(div,br);
   cards.push(`
    <div class="card standings-pool-card">
      <div class="standings-pool-head">
        <div><h3>${esc(div)} • Pool ${esc(br)}</h3></div>
        <div class="standings-pool-metrics">W · L · PE · PC · PQ</div>
      </div>
      <div class="standings-pool-table-wrap">
        <table class="standings-pool-table">
          <thead>
            <tr><th>#</th><th>Players</th><th>W</th><th>L</th><th>PE</th><th>PC</th><th>PQ</th></tr>
          </thead>
          <tbody>
            ${rows.map((r,i)=>{
              const team=teamMap[r.code]||null;
              const playerText=team?.players?.length?team.players.map(esc).join(' / '):esc(r.code);
              return `<tr><td class="rank-cell">${i+1}</td><td class="player-cell"><strong>${playerText}</strong></td><td>${r.w}</td><td>${r.l}</td><td>${r.pe}</td><td>${r.pc}</td><td>${r.pq.toFixed(4)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`);
  });
 });
 return `<div class="section-head standings-head"><div><h1>Standings</h1><p>PE = Points Earned · PC = Points Conceded · PQ = PE ÷ (PE + PC)</p></div><div class="standings-filter-card"><label>Division</label><select onchange="selectDivision(this.value)"><option value="All" ${activeStandingsDivision==='All'?'selected':''}>All standings</option>${divisions.map(d=>`<option value="${esc(d)}" ${d===activeStandingsDivision?'selected':''}>${esc(d)}</option>`).join('')}</select></div></div><div class="standings-pool-grid">${cards.join('')}</div>`}

function playoffCard(m){let codes=BASE_DATA.teams.filter(t=>t.division===m.division).map(t=>t.code);const q=qualificationForDivision(m.division);if(m.stage?.startsWith('Semifinal'))codes=eligibleSemifinalTeams(m.division);const opts=codes.map(code=>{const t=teamMap[code];return`<option value="${esc(code)}">${esc(code)} · ${esc(t?.hospital||'')}</option>`}).join('');const semiResolved=q.ready&&(q.brackets.length!==3||(q.qualifiers.length===4&&!q.winnerSeedTie?.length));const disableSemi=m.stage?.startsWith('Semifinal')&&!semiResolved?' disabled':'';return`<div class="card ko-card"><div class="panel-title"><div><h3>${esc(m.stage)}</h3><small>${esc(m.time)} · Court ${m.court}</small></div><span class="status ${statusClass(m.status)}">${esc(m.status)}</span></div><div class="teams"><div class="field"><label>Team A</label><select${disableSemi} onchange="assignPlayoff('${m.id}','A',this.value)"><option value="">TBD</option>${opts.replace(`value="${m.teamA}"`,`value="${m.teamA}" selected`)}</select></div><div class="field"><label>Team B</label><select${disableSemi} onchange="assignPlayoff('${m.id}','B',this.value)"><option value="">TBD</option>${opts.replace(`value="${m.teamB}"`,`value="${m.teamB}" selected`)}</select></div></div>${disableSemi?`<div class="progress-note">${q.ready?(q.winnerSeedTie?.length?'Resolve the bracket-winner Tournament Director Draw before assigning semifinal teams.':'Resolve the wildcard tie before assigning semifinal teams.'):'Semifinal assignment unlocks after all preliminary matches in this division are final.'}</div>`:''}<button class="btn tiny" onclick="openMatch('${m.id}')">Open Match</button></div>`}
function qualifierItem(row,label,extra=''){if(!row)return`<div class="qualifier-item"><small>${esc(label)}</small><b>TBD</b></div>`;return`<div class="qualifier-item ${extra}"><small>${esc(label)}</small><b>${esc(row.code)} · ${esc(row.hospital)}</b><span>${esc(teamNamesText(row.code))}</span><span>${(row.rate*100).toFixed(1)}% · PQ ${row.pq.toFixed(4)}</span></div>`}
function winnerSeedItem(row,label){if(!row)return`<div class="qualifier-item"><small>${esc(label)}</small><b>TBD</b></div>`;return`<div class="qualifier-item"><small>${esc(label)}</small><b>${esc(row.code)} · ${esc(row.hospital)}</b><span>WR ${(row.rate*100).toFixed(1)}% · PQ ${row.pq.toFixed(4)}</span><span>PC/Game ${row.pcpg.toFixed(2)} · PE/Game ${row.pepg.toFixed(2)}</span></div>`}
function qualificationSummary(div){const q=qualificationForDivision(div),done=divisionPrelimMatches(div).filter(m=>['Completed','Forfeit'].includes(m.status)).length,total=divisionPrelimMatches(div).length;if(q.ready&&q.unresolvedStandings?.length){const issue=q.unresolvedStandings[0];return`<div class="qualification-summary"><div class="qualification-head"><div><b>Qualification tie requires Tournament Director resolution</b><span>Bracket ${esc(issue.bracket)} still has ${issue.codes.length} teams exactly tied after Win Rate and PQ: ${esc(issue.codes.join(', '))}. The portal will not auto-seed semifinals using an alphabetical fallback.</span></div><span class="status hold">MANUAL REVIEW</span></div></div>`}if(q.brackets.length===2){const A=q.standings[q.brackets[0]]||[],B=q.standings[q.brackets[1]]||[];return`<div class="qualification-summary"><div class="qualification-head"><div><b>Semifinal qualification · 2 brackets</b><span>Top 2 from each bracket advance. Crossover: A1 vs B2 · B1 vs A2.</span></div><span class="status ${q.ready?'completed':''}">${q.ready?'Ready':`${done}/${total} prelims final`}</span></div><div class="qualifier-grid">${qualifierItem(A[0],`${q.brackets[0]}1`)}${qualifierItem(A[1],`${q.brackets[0]}2`)}${qualifierItem(B[0],`${q.brackets[1]}1`)}${qualifierItem(B[1],`${q.brackets[1]}2`)}</div></div>`}
 if(q.brackets.length===3){const winners=q.brackets.map(br=>q.standings[br]?.[0]);const wildcard=q.wildcard;const tie=q.wildcardTie||[];const candidates=q.wildcardCandidates||[];const pairing=q.pairings||[];const seedTie=q.winnerSeedTie||[];const drawOverride=state.settings?.winnerSeedDrawOverrides?.[div];const drawPerms=seedTie.length?winnerSeedPermutations(seedTie.map(r=>r.code)):[];return`<div class="qualification-summary"><div class="qualification-head"><div><b>Semifinal qualification · 3 brackets</b><span>Each bracket #1 advances. The best #2 team becomes the wildcard. Same-bracket semifinal rematches are prohibited.</span></div><span class="status ${q.ready?'completed':''}">${q.ready?'Standings final':`${done}/${total} prelims final`}</span></div><div class="qualifier-grid">${winners.map((r,i)=>qualifierItem(r,`${q.brackets[i]}1 · Bracket winner`)).join('')}${qualifierItem(wildcard,'Wildcard · Best #2','wildcard')}</div>${q.ready?`<div class="qualification-summary" style="margin:12px 0 0"><div class="qualification-head"><div><b>Bracket-winner semifinal seeding</b><span>Seed order: Win Rate → PQ → lowest PC/Game → highest PE/Game → Tournament Director Draw.</span></div>${drawOverride?`<button class="btn tiny" onclick="clearWinnerSeedDraw('${div.replaceAll("'","\\'")}')">Clear Draw</button>`:''}</div><div class="qualifier-grid">${q.winnerSeeds.map((r,i)=>winnerSeedItem(r,seedTie.some(t=>t.code===r.code)?'Semifinal seed pending draw':`Semifinal Seed #${i+1}`)).join('')}</div></div>`:''}<div class="wildcard-candidates">${candidates.map(r=>`<div class="wildcard-candidate ${wildcard?.code===r.code?'selected':''}"><strong>${esc(r.code)}</strong> · Bracket ${esc(r.bracket)} #2<br>${(r.rate*100).toFixed(1)}% · PQ ${r.pq.toFixed(4)}</div>`).join('')}</div>${q.ready&&tie.length>1&&!wildcard?`<div class="wildcard-resolve"><div class="field"><label>Exact wildcard tie — Match Control decision required</label><select id="wildcard-${div.replace(/[^a-z0-9]/gi,'')}"><option value="">Select wildcard</option>${tie.map(r=>`<option value="${esc(r.code)}">${esc(r.code)} · ${esc(r.hospital)} · ${(r.rate*100).toFixed(1)}% · PQ ${r.pq.toFixed(4)}</option>`).join('')}</select></div><button class="btn" onclick="setWildcardOverride('${div.replaceAll("'","\\'")}',document.getElementById('wildcard-${div.replace(/[^a-z0-9]/gi,'')}').value)">Confirm Wildcard</button></div>`:''}${q.ready&&seedTie.length?`<div class="wildcard-resolve"><div class="field"><label>Tournament Director Draw — bracket-winner seeds remain exactly tied</label><select id="seed-draw-${div.replace(/[^a-z0-9]/gi,'')}"><option value="">Select draw result</option>${drawPerms.map(order=>`<option value="${esc(order.join('>'))}">${esc(order.join(' → '))} (higher seed → lower seed)</option>`).join('')}</select><span class="muted small">Tied on Win Rate, PQ, PC/Game and PE/Game: ${esc(seedTie.map(r=>r.code).join(', '))}</span></div><button class="btn" onclick="setWinnerSeedDraw('${div.replaceAll("'","\\'")}',document.getElementById('seed-draw-${div.replace(/[^a-z0-9]/gi,'')}').value)">Record Draw</button></div>`:''}${q.ready&&wildcard&&pairing.length===2&&!seedTie.length?`<div class="callout" style="margin-top:10px"><b>Automatic semifinal pairing</b><p>${esc(pairing[0].label)} · ${esc(pairing[1].label)}</p><p>The wildcard is paired with the highest-seeded bracket winner from a different bracket. The remaining two bracket winners play each other.</p></div>`:''}<div class="progress-note"><b>Bracket-winner seed order:</b> Win Rate → PQ → lowest Points Conceded per Game → highest Points Earned per Game → Tournament Director Draw. <b>Wildcard comparison:</b> Win Rate → PQ. If Seed #1 came from the wildcard's bracket, that winner is skipped and the wildcard faces the next-highest eligible seed. This guarantees no immediate same-bracket rematch.</div></div>`}
}

   <div class="ref-operator-row">

   </div>

function saveMatch(id,close){const m=findMatch(id);if(!m)return;const beforeA=m.scoreA,beforeB=m.scoreB,beforeWinner=m.winner;const d=applyMatchDraft(m);if(!d)return;const corrected=m.status==='Completed'&&(beforeA!==m.scoreA||beforeB!==m.scoreB);if(corrected){m.corrections=Array.isArray(m.corrections)?m.corrections:[];m.corrections.push({time:new Date().toISOString(),type:'score-correction',before:{scoreA:beforeA,scoreB:beforeB,winner:beforeWinner},after:{scoreA:m.scoreA,scoreB:m.scoreB,winner:m.winner},reason:d.reason});if(m.kind==='prelim')markQualificationDependency(m.division);if(m.stage?.includes('Semifinal'))markMedalDependency(m.division)}const scoreTextNow=m.scoreA!=null&&m.scoreB!=null?` · score ${m.scoreA}-${m.scoreB}`:'';saveState(corrected?`${m.id} completed result corrected ${beforeA}-${beforeB} → ${m.scoreA}-${m.scoreB} · ${d.reason}`:`${m.id} match details updated${scoreTextNow}`);if(close)document.getElementById('modalBackdrop')?.classList.remove('open');else openMatch(id);toast(corrected?'Completed result corrected; dependency checks updated.':'Match update saved.')}
function quickStart(id){const m=findMatch(id);if(!m)return;if(m.removedFromSchedule){toast('Schedule this match to a court/time before starting it.');return}if(!m.teamA||!m.teamB){toast('Assign both teams before starting this match.');return}if(m.status!=='Scheduled'){toast('Only a scheduled match can be started from this control.');return}if(!canStartMatch(m))return;recordStart(m);m.status='Live';saveState(`${m.id} actually started at ${fmtDateTime(m.actualStartAt)} on Court ${m.court}`);document.getElementById('modalBackdrop')?.classList.remove('open');toast(`Court ${m.court} is live. Actual start captured.`)}
function playoffSeedLocked(m){return !m||m.status!=='Scheduled'||Boolean(m.actualStartAt||m.actualEndAt||m.resultRecordedAt)}
function clearMatchRecord(m){m.scoreA=null;m.scoreB=null;m.winner=null;m.status='Scheduled';m.actualStartAt=null;m.actualEndAt=null;m.resultRecordedAt=null;m.notes=''}
function seedPlayoffPair(m,a,b){if(!m||!a||!b||a===b)return false;if(playoffSeedLocked(m)){if(m.teamA===a&&m.teamB===b)return true;return false}if(m.teamA!==a||m.teamB!==b){m.teamA=a;m.teamB=b;clearMatchRecord(m)}return true}
function assignPlayoff(id,side,code){const m=state.playoffs.find(x=>x.id===id);if(!m)return;if(playoffSeedLocked(m)){toast(`${m.id} is already active or resolved. Reset the match record before changing participants.`);return}const q=qualificationForDivision(m.division);if(code&&!teamMap[code]){toast('Unknown team code.');return}const a=side==='A'?code:m.teamA,b=side==='B'?code:m.teamB;if(a&&b&&a===b){toast('A team cannot play itself.');return}if(m.stage?.startsWith('Semifinal')&&q.ready&&q.qualifiers.length===4){if(code&&!q.qualifiers.some(r=>r.code===code)){toast('Only confirmed semifinal qualifiers can be assigned.');return}if(code){const otherSemi=state.playoffs.find(x=>x.division===m.division&&x.stage?.startsWith('Semifinal')&&x.id!==m.id);if(otherSemi&&(otherSemi.teamA===code||otherSemi.teamB===code)){toast(`${code} is already assigned to the other semifinal.`);return}}if(q.brackets.length===3&&q.wildcard&&a&&b){const wildcard=q.wildcard.code,other=a===wildcard?b:b===wildcard?a:'';if(other&&teamMap[other]?.bracket===q.wildcard.bracket){toast(`Invalid semifinal pairing: ${wildcard} cannot face ${other} because both came from Bracket ${q.wildcard.bracket}.`);return}}}m[`team${side}`]=code;clearMatchRecord(m);saveState(`${m.id} ${side==='A'?'Team A':'Team B'} assigned to ${code||'TBD'}`)}
function applyQualificationLogic(){let seeded=0,threeBracketSeeded=0,waiting=0,unresolved=0,protectedSlots=0;for(const div of [...new Set(BASE_DATA.teams.map(t=>t.division))]){const q=qualificationForDivision(div);if(!q.ready){waiting++;continue}if(q.unresolvedStandings?.length||q.winnerSeedTie?.length||q.pairingTie?.length){unresolved++;continue}const s1=state.playoffs.find(p=>p.division===div&&p.stage==='Semifinal 1'),s2=state.playoffs.find(p=>p.division===div&&p.stage==='Semifinal 2');if(q.brackets.length===2){const p1=q.pairings[0],p2=q.pairings[1];if(s1&&p1?.a&&p1?.b){seedPlayoffPair(s1,p1.a,p1.b)?seeded++:protectedSlots++}if(s2&&p2?.a&&p2?.b){seedPlayoffPair(s2,p2.a,p2.b)?seeded++:protectedSlots++}}else if(q.brackets.length===3){if(!q.wildcard||q.pairings.length!==2){unresolved++;continue}const p1=q.pairings[0],p2=q.pairings[1];if(s1&&p1?.a&&p1?.b){if(seedPlayoffPair(s1,p1.a,p1.b)){threeBracketSeeded++;seeded++}else protectedSlots++}if(s2&&p2?.a&&p2?.b){if(seedPlayoffPair(s2,p2.a,p2.b)){threeBracketSeeded++;seeded++}else protectedSlots++}}}saveState(`Qualification logic applied: ${seeded} semifinal slots seeded${threeBracketSeeded?`; ${threeBracketSeeded} three-bracket slots used anti-rematch pairing`:''}${unresolved?`; ${unresolved} wildcard tie(s) unresolved`:''}${protectedSlots?`; ${protectedSlots} started/resolved slot(s) protected`:''}${waiting?`; ${waiting} division(s) still in prelims`:''}`);toast(protectedSlots?'Qualification updated without overwriting started/resolved semifinal records.':unresolved?'Qualification updated. Resolve outstanding standings/wildcard/pairing tie(s) before automatic semifinal seeding.':'Qualification logic applied and semifinal pairings updated.')}
function advanceMedalMatches(){let n=0,protectedSlots=0;for(const div of [...new Set(state.playoffs.map(p=>p.division))]){const semis=state.playoffs.filter(p=>p.division===div&&p.stage.startsWith('Semifinal')&&['Completed','Forfeit'].includes(p.status));if(semis.length<2)continue;const winners=semis.map(matchWinner),losers=semis.map(m=>matchWinner(m)===m.teamA?m.teamB:m.teamA);const gold=state.playoffs.find(p=>p.division===div&&p.stage==='Gold Match'),bronze=state.playoffs.find(p=>p.division===div&&p.stage==='Bronze Match');if(gold){seedPlayoffPair(gold,winners[0],winners[1])?n++:protectedSlots++}if(bronze){seedPlayoffPair(bronze,losers[0],losers[1])?n++:protectedSlots++}}saveState(`Applied completed semifinal results to ${n} medal-match slots${protectedSlots?`; ${protectedSlots} started/resolved slot(s) protected`:''}`);toast(protectedSlots?'Medal participants updated without overwriting started/resolved matches.':'Medal matches updated from semifinal results.')}
function setCheckin(code,val){state.checkin[code]=val;saveState(`${code} ${val?'checked in':'check-in removed'}`)}
function checkAll(val){const q=document.getElementById('teamSearch')?.value?.toLowerCase()||'',div=document.getElementById('teamDivision')?.value||'All',hosp=document.getElementById('teamHospital')?.value||'All';BASE_DATA.teams.filter(t=>(div==='All'||t.division===div)&&(hosp==='All'||t.hospital===hosp)&&(!q||[t.code,t.hospital,t.division,...t.players].join(' ').toLowerCase().includes(q))).forEach(t=>state.checkin[t.code]=val);saveState('Bulk check-in updated')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ACMS_Match_Control_Backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{const previous=state;try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.matches)||!Array.isArray(x.playoffs))throw new Error('schema');const normalized=normalizeState(x);if(!normalized.matches.length||!normalized.playoffs.length)throw new Error('empty');state=normalized;saveState('Validated backup imported and normalized to the current published schedule');toast('Backup restored and validated.')}catch(e){state=previous;toast('Invalid or incompatible ACMS backup file. No data was changed.')}};r.onerror=()=>toast('Backup file could not be read.');r.readAsText(file)}
function resetState(){if(!confirm('Reset all local match results, roster edits, check-ins, playoff assignments, and activity?'))return;syncRosterIntoBase(PUBLISHED_TEAMS);state=initialState();state.roster=deepClone(PUBLISHED_TEAMS);localStorage.setItem(STORAGE,JSON.stringify(state));renderAll();toast('Portal reset to published schedule and roster.')}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setSection(b.dataset.section)));document.getElementById('closeModal').onclick=()=>document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')e.currentTarget.classList.remove('open')});document.getElementById('openPlayer').onclick=()=>window.open('https://qourts.github.io/ACMS_InterHospital/','_blank','noopener,noreferrer');
document.documentElement.dataset.theme='light';try{localStorage.setItem(UIKEY,JSON.stringify({theme:'light'}))}catch(e){}

          <div class="card v3-attention"><div class="panel-title"><div><div class="eyebrow">ATTENTION</div><h3>Exceptions</h3></div><small>${blocked.length+unchecked.length} immediate</small></div><div class="exception-list">
            ${blocked.slice(0,4).map(({m,a})=>`<button class="exception-row" onclick="openMatch('${m.id}')"><span class="exception-mark ${a.state}"></span><div><b>${esc(m.id)} · Court ${m.court}</b><small>${esc(a.details?.[0]||a.label)}</small></div></button>`).join('')}
            ${unchecked.length?`<button class="exception-row" onclick="setSection('teams')"><span class="exception-mark checkin"></span><div><b>${unchecked.length} upcoming team${unchecked.length===1?'':'s'} not checked in</b><small>${esc(unchecked.slice(0,5).join(', '))}${unchecked.length>5?'…':''}</small></div></button>`:''}
            ${!blocked.length&&!unchecked.length?'<div class="empty compact">No immediate blockers.</div>':''}</div></div>
        </div>
      </div>`;
  };

  courtCard = function(c){
    const m=currentForCourt(c);
    if(!m) return `<div class="card court-card open"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state">OPEN</span></div><div class="court-match"><div class="court-block"><b>No active assignment</b><span>The court is available for tournament operations.</span></div></div><div class="court-actions"><button class="btn tiny" onclick="setSection('schedule')">View schedule</button></div></div>`;
    const avail=m.status==='Scheduled'?matchAvailability(m):null;
    const cls=m.status==='Live'?'live':m.status==='Hold'?'hold':m.status==='Result Pending'?'pending':avail?.state||'queued';
    const label=m.status==='Scheduled'?(avail?.label||'QUEUED'):m.status.toUpperCase();
    let context='';
    if(m.status==='Live') context=`<div class="court-block live-time"><b class="live-elapsed-clock" data-elapsed-start="${esc(m.actualStartAt||'')}" data-elapsed-end="">${esc(elapsedText(m.actualStartAt,null))}</b><span>Started ${esc(fmtTime(m.actualStartAt))}</span></div>`;
    else if(m.status==='Hold') context=`<div class="court-block"><b>Match on hold</b><span>Keep this court pinned until the issue is resolved.</span></div>`;
    else if(m.status==='Result Pending') context=`<div class="court-block"><b>Result pending</b><span>Finalize the score before releasing Court ${c}.</span></div>`;
    else if(avail) context=`<div class="queue-state">${availabilityHtml(m)}</div>${avail.state!=='ready'?`<div class="court-block"><span>${avail.details.map(esc).join('<br>')}</span></div>`:''}`;
    const primary=m.status==='Scheduled'&&avail?.state==='ready'?`<button class="btn tiny primary" onclick="quickStart('${m.id}')">Start Match</button>`:`<button class="btn tiny ${['Hold','Result Pending'].includes(m.status)?'primary':''}" onclick="openMatch('${m.id}')">${m.status==='Live'?'Score / End':['Hold','Result Pending'].includes(m.status)?'Resolve':'Review'}</button>`;
    return `<div class="card court-card ${cls}"><div class="court-head"><div class="court-title"><span>COURT</span><b>${c}</b></div><span class="court-state ${statusClass(label)}">${esc(label)}</span></div><div class="court-context"><b>${esc(m.id)} · ${esc(m.time)}</b><span>${esc(m.division)} · ${esc(m.stage)}</span></div><div class="court-match"><div class="teamline"><div>${teamDisplayInline(m.teamA)}</div><span class="score">${m.scoreA??'—'}</span></div><div class="teamline"><div>${teamDisplayInline(m.teamB)}</div><span class="score">${m.scoreB??'—'}</span></div>${context}</div><div class="court-actions"><button class="btn tiny" onclick="openMatch('${m.id}')">Details</button>${primary}</div></div>`;
  };

  matchControl = function(){
    return `<div class="section-head"><div><div class="eyebrow">FLOOR CONTROL</div><h1>Match Control</h1><p>Each card represents a physical court. The system prioritizes the action the tournament desk should take next.</p></div><div class="head-actions"><button class="btn" onclick="togglePlayersPanel()">${state.settings.playersPanel?'Hide':'Show'} Player Watch</button></div></div>${statusRail()}<div class="court-layout ${state.settings.playersPanel?'':'sidebar-off'}"><div class="courts-grid">${Array.from({length:10},(_,i)=>courtCard(i+1)).join('')}</div>${state.settings.playersPanel?playersPanel():''}</div>${queueHtml()}`;
  };

  schedule = function(){
    const division=document.getElementById('scheduleDivision')?.value||'All';
    const list=allMatches().filter(m=>division==='All'||m.division===division);
    const times=[...new Set([...SCHEDULE_EVENTS.map(e=>e.time),...allMatches().map(m=>m.time)])].sort((a,b)=>timeToMinutes(a)-timeToMinutes(b));
    const divs=[...new Set(BASE_DATA.teams.map(t=>t.division))];
    const tdClass=(c)=>v3FocusCourt?(c===v3FocusCourt?'v3-focus-court':'v3-muted-court'):'';
    const table=`<div class="schedule-wrap"><table class="schedule-table"><thead><tr><th>Time</th>${Array.from({length:10},(_,i)=>`<th class="${tdClass(i+1)}">Court ${i+1}</th>`).join('')}</tr></thead><tbody>${times.map(time=>{const ev=SCHEDULE_EVENTS.find(e=>e.time===time);if(ev)return `<tr class="schedule-event-row"><td>${esc(time)}</td><td colspan="10" class="schedule-event-cell"><div class="schedule-event ${ev.type}">${esc(ev.label)}</div></td></tr>`;return `<tr><td>${esc(time)}</td>${Array.from({length:10},(_,i)=>{const c=i+1,m=list.find(x=>x.time===time&&x.court===c);return `<td class="${tdClass(c)}">${m?`<div class="slot ${divisionSlotClass(m.division)} ${m.kind==='playoff'?'playoff':''} ${m.status==='Live'?'live':''}${scheduleCardClass(m)}"${scheduleCardStyle(m)} onclick="openMatch('${m.id}')">${teamSlotHtml(m.teamA)}<div class="slot-vs">vs</div>${teamSlotHtml(m.teamB)}<small>${esc(m.division)} · ${esc(m.stage)}</small><small>${esc(m.status)} ${m.scoreA!=null?'· '+esc(scoreText(m)):''}</small></div>`:''}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>`;
    const mobile=`<div class="mobile-schedule">${times.map(time=>{const ev=SCHEDULE_EVENTS.find(e=>e.time===time);if(ev)return `<div class="mobile-time-group"><div class="mobile-time-label">${esc(time)}</div><div class="mobile-event">${esc(ev.label)}</div></div>`;const ms=list.filter(m=>m.time===time&&(v3FocusCourt?m.court===v3FocusCourt:true));if(!ms.length)return'';return `<div class="mobile-time-group"><div class="mobile-time-label">${esc(time)}</div>${ms.map(m=>`<button class="mobile-match${scheduleCardClass(m)}"${scheduleCardStyle(m)} onclick="openMatch('${m.id}')"><span class="court-no">C${m.court}</span><span><b>${esc(teamNamesText(m.teamA))}</b><small>vs ${esc(teamNamesText(m.teamB))} · ${esc(m.division)}</small></span><span class="mobile-state">${esc(m.status)}</span></button>`).join('')}</div>`}).join('')}</div>`;
    return `<div class="section-head"><div><div class="eyebrow">OFFICIAL EVENT MATRIX</div><h1>Live Tournament Schedule</h1><p>Official ACMS schedule with match order, court assignments, player availability, and live tournament status.</p></div></div><div class="v3-schedule-tools"><div class="tool-left"><select id="scheduleDivision" onchange="renderScheduleOnly()"><option>All</option>${divs.map(d=>`<option ${division===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select id="v3FocusCourt" onchange="setScheduleFocus(this.value)"><option value="0">All courts</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${v3FocusCourt===i+1?'selected':''}>Focus Court ${i+1}</option>`).join('')}</select><span class="v3-schedule-note">${state.matches.length} preliminaries · ${state.playoffs.length} playoff/medal slots</span></div><div class="tool-right"><div class="schedule-legend"><span class="iw"><i></i>Intermediate Women</span><span class="im"><i></i>Intermediate Men</span><span class="nm"><i></i>Novice Men</span><span class="nw"><i></i>Novice Women</span></div></div></div>${table}${mobile}`;
  };

  // Keep the live time visible without forcing a full re-render every second.
  setInterval(()=>{
    document.querySelectorAll('.v3-live-clock').forEach(el=>{el.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
    updateElapsedClocks();
  },1000);
  updateElapsedClocks();

  // Render after the final renderer overrides are installed.
  renderAll();
  setInterval(()=>refreshActiveSection(),15000);
})();
</script>


<script id="v4-6-score-entry-guard">
(() => {
  const isScore = el => el instanceof HTMLInputElement && el.classList.contains('score-input');
  const clean = el => {
    const value = String(el.value || '').replace(/\D+/g,'').slice(0,3);
    if (el.value !== value) el.value = value;
  };
  document.addEventListener('input', e => { if (isScore(e.target)) clean(e.target); }, true);
  document.addEventListener('paste', e => {
    if (!isScore(e.target)) return;
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (/^\d{0,3}$/.test(txt.trim())) return;
    e.preventDefault();
    const digits = txt.replace(/\D+/g,'').slice(0,3);
    e.target.value = digits;
    e.target.dispatchEvent(new Event('input',{bubbles:true}));
  }, true);
  document.addEventListener('wheel', e => {
    if (isScore(e.target)) e.preventDefault();
  }, {passive:false,capture:true});
  document.addEventListener('keydown', e => {
    if (!isScore(e.target)) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  }, true);
})();
</script>
